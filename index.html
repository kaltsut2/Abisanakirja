let harjoitusIstunto = null;

function aloitaHarjoitus(maaritys) {
  edistysArvot.delete("harjoitus");
  const tehtavat = sekoita(maaritys.tee()).slice(0, ISTUNNON_PITUUS);
  harjoitusIstunto = { maaritys, tehtavat, indeksi: 0, oikein: 0, vaarin: 0 };
}

function naytaHarjoitukset() {
  if (!harjoitusIstunto) {
    const lohko = el("div", "pino");
    lisaa(lohko, el("p", "t-pieni haalea",
      "Nämä syntyvät samasta sanastosta kuin kortitkin. Rektiot ja prepositiot ovat " +
      "käytännössä ylioppilaskokeen aukkotehtävä sellaisenaan."));
    for (const osasto of OSASTOT) {
      const kuuluvat = HARJOITUKSET.filter((h) => h.osasto === osasto.nimi);
      const maarat = kuuluvat.map((h) => h.tee().length);
      lisaa(lohko, osastonOtsikko(osasto, maarat.reduce((a, b) => a + b, 0)));
      const lista = el("div", "rivilista");
      kuuluvat.forEach((maaritys, i) => {
        const rivi = el("button", "rivi");
        rivi.type = "button";
        lisaa(rivi, laatta(maaritys.vari, maaritys.kuvake));
        const kasvaa = el("div", "kasvaa");
        lisaa(kasvaa, el("div", "t-vali", maaritys.nimi));
        lisaa(kasvaa, el("div", "t-pieni haalea", maaritys.kuvaus));
        const nuoli = ikoni('<path d="M8 5.5v13l11-6.5z"/>', 17);
        nuoli.classList.add("nuoli");
        nuoli.setAttribute("fill", "currentColor");
        nuoli.setAttribute("stroke", "none");
        lisaa(rivi, kasvaa, el("span", "maara t-pieni", String(maarat[i])), nuoli);
        rivi.disabled = maarat[i] === 0;
        rivi.addEventListener("click", () => { aloitaHarjoitus(maaritys); piirra(); });
        lisaa(lista, rivi);
      });
      lisaa(lohko, lista);
    }
    return lohko;
  }

  const { tehtavat, indeksi, maaritys } = harjoitusIstunto;
  if (indeksi >= tehtavat.length) {
    const { oikein, vaarin } = harjoitusIstunto;
    harjoitusIstunto = null;
    const lohko = el("div", "pino");
    lisaa(lohko, tyhjaNakyma(maaritys.nimi + " valmis", `${oikein} oikein, ${vaarin} väärin.`, null, "✓"));
    const napit = el("div", "napit");
    lisaa(napit, nappi("Uudestaan", "ensisijainen", () => { aloitaHarjoitus(maaritys); piirra(); }));
    lisaa(napit, nappi("Muut harjoitukset", "", () => piirra()));
    lisaa(lohko, napit);
    return lohko;
  }
  return harjoitusNakyma(tehtavat[indeksi], indeksi, tehtavat.length, maaritys.nimi, () => {
    harjoitusIstunto.indeksi += 1;
    piirra();
  }, (osui) => { harjoitusIstunto[osui ? "oikein" : "vaarin"] += 1; });
}

function harjoitusNakyma(tehtava, indeksi, kokonais, otsikko, onJatka, onTulos) {
  const lohko = el("div", "pino");

  lisaa(lohko, edistyspalkki("harjoitus", indeksi / kokonais));

  const yla = el("div", "rivi-vali t-nano haalein");
  lisaa(yla, el("span", null, otsikko.toUpperCase()));
  lisaa(yla, el("span", null, `${indeksi + 1} / ${kokonais}`));
  lisaa(lohko, yla);

  const kortti = el("div", "kortti");
  lisaa(kortti, kysymysLohko(tehtava.kehote, tehtava.kysymys, tehtava.vihje));

  /* Kirjaa tuloksen. Vain jo aloitetun kortin tilastoja päivitetään: harjoitus
     ei aloita sanaa eikä siis vie sitä pois Opi-välilehden uusista sanoista. */
  const kirjaa = (osui, oikeaTeksti, kirjoitettu) => {
    onTulos(osui);
    for (const kortti of kortitSanalla.get(tehtava.sana.id) || []) {
      const t = tila(kortti);
      if (!t) continue;
      t.nahty += 1;
      if (!osui) t.virheita += 1;
    }
    if (!osui) kirjaaVirhe({ id: "harjoitus:" + tehtava.sana.id, sana: tehtava.sana, suunta: "harjoitus" },
                           kirjoitettu || "", oikeaTeksti);
    tallenna();
  };

  if (tehtava.tyyppi === "napit") {
    lisaa(kortti, vaihtoehtolohko(tehtava.napit, (valittu, palkkiSolmu) => {
      const osui = tehtava.vastaukset.includes(valittu);
      for (const b of palkkiSolmu.children) {
        b.disabled = true;
        if (tehtava.vastaukset.includes(b.textContent)) b.classList.add("oikein");
        else if (b.textContent === valittu) b.classList.add("vaarin");
      }
      const oikeaTeksti = tehtava.vastaukset[0] + " " + tehtava.sana.ruotsi;
      kirjaa(osui, oikeaTeksti, valittu);
      lisaa(kortti, palautelohko(osui ? "oikein" : "vaarin", oikeaTeksti, null, null,
                                 taivutusMuodot(tehtava.sana)));
      const jatka = nappi("Jatka", "ensisijainen leve", onJatka);
      lisaa(kortti, jatka);
      jatka.focus();
    }));
  } else if (tehtava.tyyppi === "kentat") {
    const muoto = vastauslomake({
      kentat: tehtava.kentat,
      onTarkista: (arvot) => {
        const kaikkiOikein = tehtava.kentat.every((maar, i) =>
          maar.vastaukset.some((v) => normalisoi(v) === normalisoi(arvot[i] || "")));
        const oikeaTeksti = tehtava.kentat.map((k) => k.vastaukset[0]).join(", ");
        kirjaa(kaikkiOikein, oikeaTeksti, arvot.filter(Boolean).join(", "));
        return {
          tulos: kaikkiOikein ? "oikein" : "vaarin", oikea: oikeaTeksti,
          kirjoitettu: arvot.filter(Boolean).join(", "), lisatieto: null,
          taivutus: taivutusMuodot(tehtava.sana),
        };
      },
      onJatka,
    });
    lisaa(kortti, muoto);
    queueMicrotask(() => muoto._kentat[0]?.focus());
  } else {
    const muoto = vastauslomake({
      paikanpitaja: tehtava.paikanpitaja || "vastaus",
      onTarkista: ([arvo]) => {
        const osui = tehtava.vastaukset.some((v) => normalisoi(v) === normalisoi(arvo));
        const tarkkeet = !osui && tehtava.vastaukset.some(
          (v) => riisuTarkkeet(normalisoi(v)) === riisuTarkkeet(normalisoi(arvo)));
        const oikeaTeksti = tehtava.vastaukset.join(" / ");
        kirjaa(osui, oikeaTeksti, arvo);
        return {
          tulos: osui ? "oikein" : (tarkkeet ? "melkein" : "vaarin"),
          oikea: oikeaTeksti, kirjoitettu: arvo,
          lisatieto: tarkkeet ? "Kirjainmerkki ratkaisee: kokeessa tämä on virhe." : null,
          taivutus: taivutusMuodot(tehtava.sana),
        };
      },
      onJatka,
    });
    lisaa(kortti, muoto);
    queueMicrotask(() => muoto._kentat[0].focus());
  }

  lisaa(lohko, kortti);
  if (tehtava.sana) lisaa(lohko, teoriaLinkki(tehtava.sana));
  return lohko;
}

/* ==========================================================================
   11. Ääntäminen
   ========================================================================== */
/* Ruotsin ääntäminen.

   Pelkkä lang = "sv-SE" ei riitä: ilman nimettyä ääntä selain käyttää
   järjestelmän oletusta, joka tällä koneella on suomalainen. Kolme muutakin
   asiaa kaataa äänivalinnan käytännössä:

   1. cancel() ja speak() samalla tikillä – WebKit pudottaa uuden lausuman
      äänivalinnan ja käyttää oletusta. Uusi lausuma siirretään omalle tikilleen.
   2. lang, joka ei täsmää valitun äänen kanssa – asetetaan lang aina äänestä.
   3. äänilista, joka ei ollut vielä valmis sivun latautuessa – ääni haetaan
      uudestaan jokaisella puhekerralla, ei vain kerran käynnistyksessä. */
let ruotsinAani = null;

function ruotsinAanet() {
  if (!window.speechSynthesis) return [];
  return (speechSynthesis.getVoices() || []).filter((a) => /^sv([-_]|$)/i.test(a.lang));
}

function valitseAani(toivottuNimi) {
  const aanet = ruotsinAanet();
  if (toivottuNimi) {
    const osuma = aanet.find((a) => a.name === toivottuNimi);
    if (osuma) return osuma;
  }
  return aanet.find((a) => /^sv[-_]se$/i.test(a.lang)) || aanet[0] || null;
}

function paivitaAanet() {
  ruotsinAani = valitseAani(edistyminen.asetukset.aaninimi);
}
if (window.speechSynthesis) {
  paivitaAanet();
  speechSynthesis.addEventListener("voiceschanged", paivitaAanet);
}

let puhuAjastin = null;
function puhu(teksti) {
  if (!window.speechSynthesis) return;
  try {
    paivitaAanet();
    clearTimeout(puhuAjastin);
    const aloita = () => {
      const puhe = new SpeechSynthesisUtterance(teksti);
      if (ruotsinAani) {
        puhe.voice = ruotsinAani;
        puhe.lang = ruotsinAani.lang;
      } else {
        puhe.lang = "sv-SE";
      }
      puhe.rate = 0.92;
      speechSynthesis.speak(puhe);
    };
    if (speechSynthesis.speaking || speechSynthesis.pending) {
      speechSynthesis.cancel();
      puhuAjastin = setTimeout(aloita, 70);
    } else {
      aloita();
    }
  } catch (virhe) { /* ääni ei ole koskaan välttämätön */ }
}
function aaninappi(teksti) {
  if (!window.speechSynthesis || !edistyminen.asetukset.aani) return null;
  const b = el("button", "kuvakenappi");
  b.type = "button";
  b.setAttribute("aria-label", "Kuuntele: " + teksti);
  lisaa(b, ikoni('<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>', 19));
  b.addEventListener("click", (tapahtuma) => { tapahtuma.stopPropagation(); puhu(teksti); });
  return b;
}

let teoriaHaku = "";
let teoriaKohdistus = null;

const LUOKKAVARIT = {
  verbi: "var(--luokka-verbi)",
  substantiivi: "var(--luokka-substantiivi)",
  adjektiivi: "var(--luokka-adjektiivi)",
  adverbi: "var(--luokka-adverbi)",
  ilmaus: "var(--luokka-ilmaus)",
};
/* Luvun tunnusväri on sen aiheen väri, ei sisällön enemmistön – luvun 6 sanat
   ovat sanaluokaltaan kaikkea, mutta luku on prepositioita. */
// Järjestys ratkaisee: "adverbit" sisältää merkkijonon "verbi", joten
// tarkemmat osumat on testattava ennen väljempiä.
const LUKUVARIT = [
  [/adjektiivi/i, "var(--luokka-adjektiivi)"],
  [/substantiivi/i, "var(--luokka-substantiivi)"],
  [/prepositio/i, "var(--luokka-prepositio)"],
  [/ilmauk|sanont/i, "var(--luokka-ilmaus)"],
  [/sidosteisuus|pikkusan/i, "var(--luokka-adverbi)"],
  [/adverbi/i, "var(--luokka-adverbi)"],
  [/verbi/i, "var(--luokka-verbi)"],
];
function luokkaVari(sanaluokka) { return LUOKKAVARIT[sanaluokka] || null; }
function lukuVari(otsikko) {
  for (const [kuvio, vari] of LUKUVARIT) if (kuvio.test(otsikko)) return vari;
  return null;
}
function varineliö(vari, luokka = "luvunvari") {
  const merkki = el("i", luokka);
  merkki.style.setProperty("--luokkavari", vari || "var(--luokka-neutraali)");
  return merkki;
}

function osaamisenTila(sana) {
  const pari = kortitSanalla.get(sana.id);
  if (!pari) return "";
  if (pari.some(onLeech)) return "vaikea";
  if (pari.every(onValmistunut)) return "valmis";
  if (pari.some((kortti) => tila(kortti))) return "opittava";
  return "";
}

function korostaOsumat(teksti, haku) {
  if (!haku) return document.createTextNode(teksti);
  const pala = document.createDocumentFragment();
  const matala = teksti.toLowerCase();
  const kohde = haku.toLowerCase();
  let alku = 0;
  for (;;) {
    const osuma = matala.indexOf(kohde, alku);
    if (osuma === -1) break;
    if (osuma > alku) pala.appendChild(document.createTextNode(teksti.slice(alku, osuma)));
    pala.appendChild(el("mark", null, teksti.slice(osuma, osuma + kohde.length)));
    alku = osuma + kohde.length;
  }
  pala.appendChild(document.createTextNode(teksti.slice(alku)));
  return pala;
}

function osuukoHakuun(sana, matala) {
  if (hakusana(sana).toLowerCase().includes(matala)) return true;
  if (sana.suomi.join(", ").toLowerCase().includes(matala)) return true;
  return sana.esimerkit.some((esim) =>
    (esim.sv || "").toLowerCase().includes(matala) ||
    (esim.fi || "").toLowerCase().includes(matala));
}

function piirraSanaRivi(sana, haku) {
  const rivi = el("div", "sana-rivi");
  rivi.id = "sana-" + sana.id;
  const merkki = el("i", "osaaminen");
  const tilanne = osaamisenTila(sana);
  if (tilanne) merkki.dataset.tila = tilanne;
  merkki.title = { opittava: "Opi-vaiheessa", valmis: "Valmistunut", vaikea: "Vaikea sana" }[tilanne] || "Ei aloitettu";
  lisaa(rivi, merkki);

  const sisus = el("div", "sisus");
  const otsikko = el("div", "sv");
  otsikko.appendChild(korostaOsumat(hakusana(sana), haku));
  if (sana.rektio) lisaa(otsikko, el("span", "lippu rektio", sana.rektio));
  if (sana.luokka) {
    const lippu = el("span", "lippu", sana.luokka);
    const vari = luokkaVari(sana.sanaluokka);
    if (vari) {
      lippu.dataset.luokkavari = sana.sanaluokka;
      lippu.style.setProperty("--luokkavari", vari);
      lippu.title = sana.sanaluokka;
    }
    lisaa(otsikko, lippu);
  }
  lisaa(sisus, otsikko);

  const kaannos = el("div", "fi");
  kaannos.appendChild(korostaOsumat(sana.suomi.join(", "), haku));
  const pari = sana.vastakohta && sanatTunnuksella.get(sana.vastakohta);
  if (pari) lisaa(kaannos, el("span", "vastakohta", "↔ " + pari.ruotsi));
  lisaa(sisus, kaannos);

  if (sana.esimerkit.length) lisaa(sisus, esimerkkiLista(sana.esimerkit));
  lisaa(rivi, sisus);
  const aani = aaninappi(sana.ruotsi);
  if (aani) lisaa(rivi, aani);
  return rivi;
}

function piirraKohta(kohta, haku) {
  switch (kohta.tyyppi) {
    case "sana": return piirraSanaRivi(kohta, haku);
    case "teksti": return el("p", "teksti", kohta.teksti);
    case "otsikko": return el("h4", "valiotsikko", kohta.teksti);
    case "korjaus": {
      const solmu = el("div", "korjaus");
      lisaa(solmu, el("b", null, "Korjaus: "));
      solmu.appendChild(document.createTextNode(kohta.teksti));
      return solmu;
    }
    case "huomio": return el("div", "huomio", kohta.teksti);
    case "muistilista": return el("div", "muistilista", kohta.teksti);
    case "esimerkki": return esimerkkiLista(kohta.esimerkit);
    default: return null;
  }
}

function lukuTunniste(otsikko) {
  return "luku-" + otsikko.split(" ")[0].replace(/[.]/g, "-");
}

function alaluvunSanat(alaluku) {
  return alaluku.sisalto.filter((k) => k.tyyppi === "sana" && kelpaaKortiksi(k));
}
function luvunSanat(luku) {
  return luku.alaluvut.flatMap(alaluvunSanat);
}

/* Harjoittele-nappi lukujen ja alalukujen otsikoissa. */
function harjoitusNappi(otsikko, sanat) {
  if (sanat.length < 3) return null;
  const b = el("button", "harjoita", "Harjoittele");
  b.type = "button";
  b.setAttribute("aria-label", "Harjoittele: " + otsikko);
  b.addEventListener("click", (tapahtuma) => {
    tapahtuma.stopPropagation();
    avaaHarjoitusvalinta(otsikko, sanat);
  });
  return b;
}

function naytaTeoria() {
  const juuri = document.createDocumentFragment();
  const haku = teoriaHaku.trim();

  if (haku.length >= 2) {
    const matala = haku.toLowerCase();
    let osumia = 0;
    for (const luku of sanasto.luvut) {
      for (const alaluku of luku.alaluvut) {
        const osuvat = alaluku.sisalto.filter((kohta) =>
          kohta.tyyppi === "sana" && osuukoHakuun(kohta, matala));
        if (!osuvat.length) continue;
        osumia += osuvat.length;
        lisaa(juuri, el("h3", "alaluku t-vali", (alaluku.otsikko || luku.otsikko)));
        for (const sana of osuvat) lisaa(juuri, piirraSanaRivi(sana, haku));
      }
    }
    if (!osumia) {
      lisaa(juuri, tyhjaNakyma("Ei osumia", `Haulla “${haku}” ei löytynyt sanoja.`, null, "○"));
    } else {
      const laskuri = el("p", "t-nano haalein", osumia + " OSUMAA");
      juuri.insertBefore(laskuri, juuri.firstChild);
    }
    return juuri;
  }

  for (const kohta of sanasto.johdanto) {
    const solmu = piirraKohta(kohta, "");
    if (solmu) lisaa(juuri, solmu);
  }

  const selite = el("div", "selite");
  for (const [sanaluokka, vari] of Object.entries(LUOKKAVARIT)) {
    const kohta = el("span");
    const merkki = el("i");
    merkki.style.setProperty("--luokkavari", vari);
    lisaa(kohta, merkki, document.createTextNode(sanaluokka));
    lisaa(selite, kohta);
  }
  lisaa(juuri, selite);

  const sanojaYhteensa = sanasto.luvut.reduce((summa, luku) => summa + luku.alaluvut.reduce(
    (a, alaluku) => a + alaluku.sisalto.filter((k) => k.tyyppi === "sana").length, 0), 0);
  lisaa(juuri, osastonOtsikko(
    { nimi: "Luvut", vari: "var(--korostus-kirkas)", kuvake: KUVAKKEET.muodot }, sanojaYhteensa));

  const sisallys = el("div", "rivilista");
  for (const luku of sanasto.luvut) {
    const sanoja = luku.alaluvut.reduce(
      (summa, a) => summa + a.sisalto.filter((k) => k.tyyppi === "sana").length, 0);
    if (!sanoja && !luku.alaluvut.length) continue;
    const rivi = el("button", "rivi");
    rivi.type = "button";
    const numero = (luku.otsikko.match(/^(\d+)\s/) || [])[1];
    const nimi = numero ? luku.otsikko.slice(numero.length + 1) : luku.otsikko;
    lisaa(rivi, laatta(lukuVari(luku.otsikko), numero || "·", true));
    const kasvaa = el("div", "kasvaa");
    lisaa(kasvaa, el("div", "t-vali", nimi));
    lisaa(rivi, kasvaa, el("span", "maara t-pieni", String(sanoja)));
    rivi.addEventListener("click", () => {
      document.getElementById(lukuTunniste(luku.otsikko))?.scrollIntoView({
        behavior: kevytLiike.matches ? "auto" : "smooth", block: "start",
      });
    });
    lisaa(sisallys, rivi);
  }
  lisaa(juuri, sisallys);

  for (const luku of sanasto.luvut) {
    const vari = lukuVari(luku.otsikko);
    const otsikko = el("h2", "luku t-otsikko");
    otsikko.id = lukuTunniste(luku.otsikko);
    if (vari) otsikko.style.setProperty("--luokkavari", vari);
    lisaa(otsikko, varineliö(vari), el("span", "kasvaa", luku.otsikko));
    const lukunappi = harjoitusNappi(luku.otsikko, luvunSanat(luku));
    if (lukunappi) lisaa(otsikko, lukunappi);
    lisaa(juuri, otsikko);
    for (const alaluku of luku.alaluvut) {
      if (alaluku.otsikko) {
        const rivi = el("h3", "alaluku t-vali");
        rivi.id = lukuTunniste(alaluku.otsikko);
        lisaa(rivi, varineliö(vari), el("span", null, alaluku.otsikko));
        const alanappi = harjoitusNappi(alaluku.otsikko, alaluvunSanat(alaluku));
        if (alanappi) lisaa(rivi, alanappi);
        lisaa(juuri, rivi);
      }
      for (const kohta of alaluku.sisalto) {
        const solmu = piirraKohta(kohta, "");
        if (solmu) lisaa(juuri, solmu);
      }
    }
  }
  return juuri;
}

function naytaTeoriassa(sana) {
  teoriaHaku = "";
  teoriaKohdistus = sana.id;
  if (valilehti === "teoria") { piirra(); return; }
  vaihdaValilehti("teoria");
}

/* ==========================================================================
   13. Levy – materiaali saapuu, ja sen voi vetää pois
   ========================================================================== */
function avaaLevy(otsikko, taytaSisalto) {
  const juuri = $("#levyt");
  const himmennys = el("div", "himmennys");
  const levy = el("div", "levy");
  levy.setAttribute("role", "dialog");
  levy.setAttribute("aria-modal", "true");
  levy.setAttribute("aria-label", otsikko);

  const sisus = el("div", "levy-sisus pino");
  lisaa(sisus, el("div", "kahva"));
  const ylarivi = el("div", "rivi-vali");
  lisaa(ylarivi, el("h2", "t-otsikko", otsikko));
  const sulje = el("button", "kuvakenappi");
  sulje.type = "button";
  sulje.setAttribute("aria-label", "Sulje");
  lisaa(sulje, ikoni('<path d="M18 6 6 18M6 6l12 12"/>', 20));
  lisaa(ylarivi, sulje);
  lisaa(sisus, ylarivi);
  taytaSisalto(sisus, () => sulkeminen());
  lisaa(levy, sisus);
  lisaa(juuri, himmennys, levy);

  const korkeus = () => levy.offsetHeight || 1;
  const asetaSijainti = (osuus) => {
    levy.style.transform = `translate3d(0, ${osuus * 100}%, 0)`;
    himmennys.style.opacity = String(Math.max(0, 1 - osuus));
  };

  // Vaimennus 1.0: paneeli ei pomppaa auetessaan, koska mikään ele ei tuonut
  // siihen liike-energiaa. Vetämällä suljettaessa nopeus välitetään jouselle.
  const jousi = new Jousi(1, { vaimennus: 1, vaste: 0.36, onPaivitys: asetaSijainti });
  requestAnimationFrame(() => jousi.kohti(0));

  let suljettu = false;
  function sulkeminen(nopeus = 0) {
    if (suljettu) return;
    suljettu = true;
    document.removeEventListener("keydown", nappain);
    jousi.onValmis = () => { himmennys.remove(); levy.remove(); };
    jousi.kohti(1, nopeus);
    if (kevytLiike.matches) { himmennys.remove(); levy.remove(); }
  }
  function nappain(tapahtuma) { if (tapahtuma.key === "Escape") sulkeminen(); }
  document.addEventListener("keydown", nappain);
  himmennys.addEventListener("click", () => sulkeminen());
  sulje.addEventListener("click", () => sulkeminen());

  /* Vetäminen: 1:1 sormen kanssa, kumilenkki ylärajalla, heitto projisoidaan. */
  let veto = null;
  levy.addEventListener("pointerdown", (tapahtuma) => {
    if (tapahtuma.target.closest("button, input, select, textarea, a")) return;
    if (levy.scrollTop > 0) return;
    levy.setPointerCapture(tapahtuma.pointerId);
    jousi.pysayta();
    veto = { alkuY: tapahtuma.clientY, alkuOsuus: jousi.arvo, historia: [] };
  });
  levy.addEventListener("pointermove", (tapahtuma) => {
    if (!veto) return;
    const siirto = tapahtuma.clientY - veto.alkuY;
    let osuus = veto.alkuOsuus + siirto / korkeus();
    if (osuus < 0) osuus = -kumilenkki(-osuus * korkeus(), korkeus()) / korkeus();
    jousi.arvo = osuus;
    asetaSijainti(osuus);
    veto.historia.push({ y: tapahtuma.clientY, t: performance.now() });
    if (veto.historia.length > 5) veto.historia.shift();
  });
  const lopeta = (tapahtuma) => {
    if (!veto) return;
    const historia = veto.historia;
    veto = null;
    let nopeus = 0;
    if (historia.length >= 2) {
      const eka = historia[0];
      const vika = historia[historia.length - 1];
      const dt = (vika.t - eka.t) / 1000;
      if (dt > 0) nopeus = (vika.y - eka.y) / dt;   // px/s
    }
    // Projisoidaan lepopiste vauhdista, ei nykyisestä sijainnista.
    const projektio = jousi.arvo + projisoi(nopeus) / korkeus();
    if (projektio > 0.4) sulkeminen(nopeus / korkeus());
    else jousi.kohti(0, nopeus / korkeus());
  };
  levy.addEventListener("pointerup", lopeta);
  levy.addEventListener("pointercancel", lopeta);

  queueMicrotask(() => levy.querySelector("button, input, select")?.focus());
  return sulkeminen;
}

function kumilenkki(ylitys, mitta, vakio = 0.55) {
  return (ylitys * mitta * vakio) / (mitta + vakio * Math.abs(ylitys));
}
function projisoi(nopeus, hidastuvuus = 0.998) {
  return (nopeus / 1000) * hidastuvuus / (1 - hidastuvuus);
}

/* ==========================================================================
   14. Suodatin ja asetukset
   ========================================================================== */
function suodatetutSanat() {
  const suodatin = edistyminen.asetukset.suodatin;
  if (!suodatin) return kaikkiSanat;
  if (suodatin.tyyppi === "luku") return kaikkiSanat.filter((s) => s._luku === suodatin.arvo);
  if (suodatin.tyyppi === "sanaluokka") return kaikkiSanat.filter((s) => s.sanaluokka === suodatin.arvo);
  return kaikkiSanat;
}
function suodattimenNimi() {
  const suodatin = edistyminen.asetukset.suodatin;
  return suodatin ? suodatin.arvo : "Koko sanasto";
}

function vieEdistyminen() {
  const sisalto = JSON.stringify(edistyminen, null, 1);
  const paiva = new Date().toISOString().slice(0, 10);
  const nimi = `ruotsi-edistyminen-${paiva}.json`;
  try {
    const linkki = el("a");
    linkki.href = URL.createObjectURL(new Blob([sisalto], { type: "application/json" }));
    linkki.download = nimi;
    document.body.appendChild(linkki);
    linkki.click();
    setTimeout(() => { URL.revokeObjectURL(linkki.href); linkki.remove(); }, 1000);
    ilmoita("Edistyminen viety tiedostoon " + nimi);
    return true;
  } catch (virhe) {
    return false;
  }
}

function tuoEdistyminen(teksti) {
  const data = JSON.parse(teksti);
  if (!data || data.versio !== 1 || typeof data.kortit !== "object") {
    throw new Error("Tiedosto ei ole tämän sovelluksen edistymistiedosto.");
  }
  edistyminen = Object.assign(oletusEdistyminen(), data);
  edistyminen.asetukset = Object.assign(oletusEdistyminen().asetukset, data.asetukset || {});
  oppiIstunto = kertausIstunto = harjoitusIstunto = null;
  tallenna();
}

function avaaAsetukset() {
  avaaLevy("Asetukset", (sisus, sulje) => {
    /* Rajaus */
    const rajaus = el("div", "pino-tiivis");
    lisaa(rajaus, el("p", "t-nano haalein", "RAJAA HARJOITTELU"));
    const valikko = el("select", "kentta");
    const lisaaValinta = (teksti, arvo, valittu) => {
      const kohta = el("option", null, teksti);
      kohta.value = arvo;
      if (valittu) kohta.selected = true;
      lisaa(valikko, kohta);
    };
    const nyt = edistyminen.asetukset.suodatin;
    lisaaValinta("Koko sanasto", "", !nyt);
    for (const luku of sanasto.luvut) {
      const maara = luku.alaluvut.reduce(
        (s, a) => s + a.sisalto.filter((k) => k.tyyppi === "sana" && kelpaaKortiksi(k)).length, 0);
      if (maara) lisaaValinta(`${luku.otsikko} (${maara})`, "luku:" + luku.otsikko,
                              nyt?.tyyppi === "luku" && nyt.arvo === luku.otsikko);
    }
    for (const sanaluokka of ["verbi", "substantiivi", "adjektiivi", "adverbi", "ilmaus"]) {
      const maara = kaikkiSanat.filter((s) => s.sanaluokka === sanaluokka && kelpaaKortiksi(s)).length;
      if (maara) lisaaValinta(`Vain ${sanaluokka}t (${maara})`, "sanaluokka:" + sanaluokka,
                              nyt?.tyyppi === "sanaluokka" && nyt.arvo === sanaluokka);
    }
    valikko.addEventListener("change", () => {
      const arvo = valikko.value;
      edistyminen.asetukset.suodatin = arvo
        ? { tyyppi: arvo.slice(0, arvo.indexOf(":")), arvo: arvo.slice(arvo.indexOf(":") + 1) }
        : null;
      oppiIstunto = kertausIstunto = harjoitusIstunto = null;
      tallenna();
      piirra();
    });
    lisaa(rajaus, valikko);
    lisaa(sisus, rajaus);

    /* Vaikeustaso */
    lisaa(sisus, kytkinrivi(
      "Näytä taivutusluokka",
      "Taivutustreenissä luokka (I, IIb, 3, 5…) kertoo kaavan. Piilota se, kun " +
      "haluat hakea muodot muistista.",
      edistyminen.asetukset.naytaLuokka,
      (arvo) => { edistyminen.asetukset.naytaLuokka = arvo; tallenna(); piirra(); }));

    /* Ääni */
    if (window.speechSynthesis) {
      lisaa(sisus, kytkinrivi(
        "Ääntämisnappi sanojen vieressä", null,
        edistyminen.asetukset.aani,
        (arvo) => { edistyminen.asetukset.aani = arvo; tallenna(); piirra(); }));
      const aanet = ruotsinAanet();
      if (aanet.length) {
        const valinta = el("div", "pino-tiivis");
        lisaa(valinta, el("p", "t-nano haalein", "RUOTSIN ÄÄNI"));
        const valikko = el("select", "kentta");
        for (const aani of aanet) {
          const kohta = el("option", null, aani.name + " (" + aani.lang + ")");
          kohta.value = aani.name;
          if (ruotsinAani && aani.name === ruotsinAani.name) kohta.selected = true;
          lisaa(valikko, kohta);
        }
        valikko.addEventListener("change", () => {
          edistyminen.asetukset.aaninimi = valikko.value;
          paivitaAanet();
          tallenna();
          puhu("Jag talar svenska");
        });
        lisaa(valinta, valikko);
        lisaa(valinta, nappi("Kokeile ääntä", "leve", () => puhu("Jag undviker att svara")));
        lisaa(valinta, el("p", "t-pieni haalea",
          aanet.length > 1
            ? "Useampi ruotsin ääni asennettuna. Valitse se, joka kuulostaa parhaalta."
            : "Vain yksi ruotsin ääni asennettuna. Parempilaatuisia saa macOS:n " +
              "Järjestelmäasetukset → Käyttöapu → Puhuttu sisältö → Järjestelmän ääni → " +
              "Hallitse ääniä → Ruotsi."));
        lisaa(sisus, valinta);
      } else {
        lisaa(sisus, el("p", "t-pieni haalea",
          "Ruotsin ääntä ei ole asennettuna, joten lausuminen menee suomalaisittain. " +
          "macOS: Järjestelmäasetukset → Käyttöapu → Puhuttu sisältö → Järjestelmän ääni → " +
          "Hallitse ääniä → Ruotsi. iOS: Asetukset → Käyttöapu → Puhuttu sisältö → Äänet → Ruotsi."));
      }
    }

    /* Varmuuskopiot omana näkymänään */
    const omia = (edistyminen.omatSanat || []).length;
    const kopiorivi = el("button", "rivi");
    kopiorivi.type = "button";
    const kopiokasvaa = el("div", "kasvaa");
    lisaa(kopiokasvaa, el("div", "t-vali", "Varmuuskopiot ja omat sanat"));
    lisaa(kopiokasvaa, el("div", "t-pieni haalea",
      omia ? `Vie, palauta ja lisää sanoja – ${omia} omaa sanaa` : "Vie, palauta ja lisää sanoja"));
    const kopionuoli = ikoni('<path d="m9 6 6 6-6 6"/>', 18);
    kopionuoli.classList.add("nuoli");
    lisaa(kopiorivi, kopiokasvaa, kopionuoli);
    kopiorivi.addEventListener("click", () => { sulje(); avaaVarmuuskopiot(); });
    lisaa(sisus, kopiorivi);

    /* Vaikeat sanat */
    const vaikeat = kortit.filter(onLeech);
    if (vaikeat.length) {
      const lohko = el("div", "pino-tiivis");
      lisaa(lohko, el("p", "t-nano haalein", `VAIKEAT SANAT (${vaikeat.length})`));
      lisaa(lohko, el("p", "t-pieni haalea",
        "Nämä ovat menneet väärin vähintään viisi kertaa. Toistaminen ei yleensä auta – " +
        "kokeile opetella ne esimerkkilauseen tai muistisäännön kautta."));
      const nahdyt = new Set();
      for (const kortti of vaikeat.slice(0, 12)) {
        if (nahdyt.has(kortti.sana.id)) continue;
        nahdyt.add(kortti.sana.id);
        const rivi = el("button", "rivi");
        rivi.type = "button";
        const kasvaa = el("div", "kasvaa");
        lisaa(kasvaa, el("div", "t-vali", kortti.sana.ruotsi));
        lisaa(kasvaa, el("div", "t-pieni haalea", kortti.sana.suomi.join(", ")));
        lisaa(rivi, kasvaa, el("span", "maara t-pieni", (tila(kortti)?.virheita || 0) + " virhettä"));
        rivi.addEventListener("click", () => { sulje(); naytaTeoriassa(kortti.sana); });
        lisaa(lohko, rivi);
      }
      lisaa(sisus, lohko);
    }

    /* Virheloki */
    if (edistyminen.virheloki.length) {
      const lohko = el("div", "pino-tiivis");
      lisaa(lohko, el("p", "t-nano haalein", "VIIMEISIMMÄT VIRHEET"));
      for (const virhe of edistyminen.virheloki.slice(0, 12)) {
        const rivi = el("div", "sana-rivi");
        const sisus2 = el("div", "sisus");
        const yla = el("div", "t-pieni");
        lisaa(yla, el("del", null, virhe.kirjoitettu || "(tyhjä)"));
        lisaa(yla, el("span", null, "  →  "));
        lisaa(yla, el("b", null, virhe.oikea));
        lisaa(sisus2, yla);
        lisaa(sisus2, el("div", "t-nano haalein", virhe.sana + " · " + virhe.suunta));
        lisaa(rivi, sisus2);
        lisaa(lohko, rivi);
      }
      lisaa(sisus, lohko);
    }

    /* Nollaus */
    const nollaus = nappi("Nollaa kaikki edistyminen", "", () => {
      if (!confirm("Tämä poistaa kaikki laatikot, virhelokin ja välitoiston tiedot. Ei voi perua.")) return;
      edistyminen = oletusEdistyminen();
      oppiIstunto = kertausIstunto = harjoitusIstunto = null;
      tallenna(); sulje(); piirra();
    });
    nollaus.style.color = "var(--vaarin)";
    lisaa(sisus, nollaus);

    /* Tilastot */
    const valmiit = kortit.filter(onValmistunut).length;
    const aloitetut = kortit.filter((k) => tila(k)).length;
    lisaa(sisus, el("p", "t-nano haalein",
      `${kortit.length} KORTTIA · ${aloitetut} ALOITETTU · ${valmiit} VÄLITOISTOSSA`));
  });
}

function kytkinrivi(otsikko, selite, arvo, onMuutos) {
  const kuori = el("label", "kytkinrivi");
  const teksti = el("div", "kasvaa");
  lisaa(teksti, el("div", null, otsikko));
  if (selite) lisaa(teksti, el("div", "t-pieni haalea", selite));
  const kytkin = el("input");
  kytkin.type = "checkbox";
  kytkin.checked = Boolean(arvo);
  kytkin.addEventListener("change", () => onMuutos(kytkin.checked));
  lisaa(kuori, teksti, kytkin);
  return kuori;
}

/* ==========================================================================
   14b. Varmuuskopiot ja omat sanat
   ========================================================================== */
function tekstilaatikko(arvo, vainLuku, rivit = 5) {
  const laatikko = el("textarea", "kentta laatikko");
  laatikko.rows = rivit;
  laatikko.spellcheck = false;
  laatikko.autocapitalize = "off";
  if (arvo != null) laatikko.value = arvo;
  if (vainLuku) laatikko.readOnly = true;
  return laatikko;
}

function osio(otsikko, selite) {
  const lohko = el("div", "pino-tiivis osio");
  lisaa(lohko, el("p", "t-nano haalein", otsikko.toUpperCase()));
  if (selite) lisaa(lohko, el("p", "t-pieni haalea", selite));
  return lohko;
}

async function kopioiLeikepoydalle(teksti, palaute) {
  try {
    await navigator.clipboard.writeText(teksti);
    palaute("Kopioitu leikepöydälle.");
  } catch (virhe) {
    palaute("Selain ei antanut kopioida – valitse teksti ja kopioi käsin.");
  }
}

function avaaVarmuuskopiot() {
  avaaLevy("Varmuuskopiot ja omat sanat", (sisus, sulje) => {
    const paluu = nappi("‹ Asetukset", "hiljainen", () => { sulje(); avaaAsetukset(); });
    paluu.style.alignSelf = "flex-start";
    lisaa(sisus, paluu);

    /* --- Vie --- */
    const vienti = osio("Vie edistyminen",
      "Edistyminen elää vain tämän selaimen muistissa ja katoaa, jos selaimen tiedot " +
      "tyhjennetään. Ota kopio silloin tällöin.");
    const vientiViesti = el("p", "t-pieni haalea");
    const vientiLaatikko = tekstilaatikko(JSON.stringify(edistyminen), true, 4);
    const vientiNapit = el("div", "napit");
    lisaa(vientiNapit, nappi("Vie tiedostoon", "ensisijainen", () => {
      vientiViesti.textContent = vieEdistyminen()
        ? "Tiedosto tallennettu." : "Lataus ei onnistunut – kopioi teksti alta.";
    }));
    lisaa(vientiNapit, nappi("Kopioi", "", () => {
      vientiLaatikko.select();
      kopioiLeikepoydalle(vientiLaatikko.value, (v) => { vientiViesti.textContent = v; });
    }));
    lisaa(vienti, vientiNapit, vientiLaatikko, vientiViesti);
    lisaa(sisus, vienti);

    /* --- Palauta --- */
    const palautus = osio("Palauta varmuuskopiosta",
      "Korvaa kaiken nykyisen edistymisen. Liitä varmuuskopion teksti tai valitse tiedosto.");
    const palautusViesti = el("p", "t-pieni haalea");
    const palautusLaatikko = tekstilaatikko("", false, 4);
    palautusLaatikko.placeholder = "Liitä varmuuskopion JSON tähän";
    const tiedosto = el("input");
    tiedosto.type = "file";
    tiedosto.accept = "application/json,.json";
    tiedosto.style.display = "none";
    const palautaTeksti = (teksti) => {
      try {
        tuoEdistyminen(teksti);
        for (const sana of edistyminen.omatSanat || []) sijoitaSana(sana);
        rakennaSanastoUudelleen();
        sulje();
        piirra();
        ilmoita("Edistyminen palautettu.");
      } catch (virhe) {
        palautusViesti.textContent = "Ei onnistunut: " + virhe.message;
      }
    };
    tiedosto.addEventListener("change", async () => {
      const valittu = tiedosto.files?.[0];
      if (valittu) palautaTeksti(await valittu.text());
    });
    const palautusNapit = el("div", "napit");
    lisaa(palautusNapit, nappi("Palauta liitetystä", "", () => {
      if (!palautusLaatikko.value.trim()) { palautusViesti.textContent = "Laatikko on tyhjä."; return; }
      if (confirm("Tämä korvaa kaiken nykyisen edistymisen. Jatketaanko?")) palautaTeksti(palautusLaatikko.value);
    }));
    lisaa(palautusNapit, nappi("Tuo tiedostosta", "", () => tiedosto.click()));
    lisaa(palautus, palautusLaatikko, palautusNapit, palautusViesti, tiedosto);
    lisaa(sisus, palautus);

    /* --- Lisää sanoja --- */
    const lisays = osio("Lisää sanoja JSONilla",
      "Liitä sanastodumpin tuloste sellaisenaan, tai lista sanoja. Sanat sijoittuvat " +
      "niihin lukuihin, jotka niissä on merkitty – tuntemattomat menevät lukuun “Omat sanat”.");
    const lisaysViesti = el("p", "t-pieni haalea");
    const lisaysLaatikko = tekstilaatikko("", false, 6);
    lisaysLaatikko.placeholder =
      '[{"ruotsi": "en glass", "suomi": ["jäätelö"], "sanaluokka": "substantiivi",\n' +
      '  "luokka": "3", "suku": "en", "taivutus": ["glassen", "glassar", "glassarna"]}]';
    const sijoita = nappi("Sijoita sanastoon", "ensisijainen", () => {
      const teksti = lisaysLaatikko.value.trim();
      if (!teksti) { lisaysViesti.textContent = "Laatikko on tyhjä."; return; }
      let sanat;
      try {
        sanat = jasennaSanaSyote(teksti);
      } catch (virhe) {
        lisaysViesti.textContent = "JSON ei jäsentynyt: " + virhe.message;
        return;
      }
      if (!sanat.length) {
        lisaysViesti.textContent =
          "Yhtään sanaa ei löytynyt. Jokaisella pitää olla vähintään ruotsi ja suomi.";
        return;
      }
      const kohteet = new Set();
      for (const sana of sanat) {
        edistyminen.omatSanat.push(sana);
        kohteet.add(sijoitaSana(sana));
      }
      edistyminen.viimeisinLisays = { aika: Date.now(), idt: sanat.map((s) => s.id) };
      rakennaSanastoUudelleen();
      tallenna();
      lisaysLaatikko.value = "";
      lisaysViesti.textContent =
        `${sanat.length} sanaa sijoitettu: ${[...kohteet].join(", ")}.`;
      ilmoita(sanat.length + " sanaa lisätty sanastoon.");
      piirra();
    });
    lisaa(lisays, lisaysLaatikko, sijoita, lisaysViesti);

    const era = edistyminen.viimeisinLisays;
    if (era && era.idt.length) {
      const hetki = new Date(era.aika).toLocaleString("fi-FI",
        { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" });
      const peru = nappi(`Peru viimeisin lisäys (${era.idt.length} sanaa)`, "leve", () => {
        const maara = poistaOmatSanat(era.idt);
        sulje();
        avaaVarmuuskopiot();
        piirra();
        ilmoita(maara + " sanaa poistettu.");
      });
      peru.style.color = "var(--vaarin)";
      lisaa(lisays, peru);
      lisaa(lisays, el("p", "t-nano haalein", "LISÄTTY " + hetki));
    }

    lisaa(sisus, lisays);

    /* --- Omat sanat --- */
    const omat = edistyminen.omatSanat || [];
    if (omat.length) {
      const lista = osio(`Omat sanat (${omat.length})`,
        "Nämä elävät selaimen muistissa, eivät sanastotiedostossa. Ne kulkevat mukana " +
        "varmuuskopiossa.");
      for (const sana of omat.slice().reverse()) {
        const rivi = el("div", "rivi");
        const kasvaa = el("div", "kasvaa");
        lisaa(kasvaa, el("div", "t-vali", sana.ruotsi));
        lisaa(kasvaa, el("div", "t-pieni haalea",
          sana.suomi.join(", ") + " · " + (sana.alakategoria || sana.kategoria || "")));
        const poista = el("button", "kuvakenappi");
        poista.type = "button";
        poista.setAttribute("aria-label", "Poista " + sana.ruotsi);
        lisaa(poista, ikoni('<path d="M18 6 6 18M6 6l12 12"/>', 18));
        poista.addEventListener("click", () => {
          if (!confirm(`Poistetaanko “${sana.ruotsi}” ja sen edistyminen?`)) return;
          poistaOmaSana(sana.id);
          sulje();
          avaaVarmuuskopiot();
          piirra();
        });
        lisaa(rivi, kasvaa, poista);
        lisaa(lista, rivi);
      }
      lisaa(sisus, lista);
    }
  });
}

function naytaTeksti(otsikko, teksti) {
  avaaLevy(otsikko, (sisus) => {
    const kentta = el("textarea", "kentta");
    kentta.rows = 10;
    kentta.value = teksti;
    kentta.readOnly = true;
    lisaa(sisus, el("p", "t-pieni haalea", "Kopioi tämä talteen."), kentta);
    queueMicrotask(() => { kentta.focus(); kentta.select(); });
  });
}

/* ==========================================================================
   15. Navigaatio ja piirto
   ========================================================================== */
const VALILEHDET = [
  { id: "opi", nimi: "Opi",
    kuvake: '<circle cx="12" cy="12" r="8.5"/><path d="M12 8.5v7M8.5 12h7"/>' },
  { id: "kertaa", nimi: "Kertaa",
    kuvake: '<path d="M20 11.5a8 8 0 1 1-2.6-5.4"/><path d="M20 4v5h-5"/>' },
  { id: "harjoitukset", nimi: "Harjoitukset",
    kuvake: '<rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/>' },
  { id: "teoria", nimi: "Teoria",
    kuvake: '<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H19v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M8 8.5h7M8 12h7M8 15.5h4"/>' },
];
const AVAIN_VALILEHTI = "ruotsi.valilehti";

let valilehti = "opi";
const sijainnit = {};

function piirraAlapalkki() {
  const juuri = $("#alapalkki");
  juuri.textContent = "";
  const palkki = el("div", "valilehdet");
  lisaa(juuri, palkki);
  const eraantyy = kortit.filter(erääntyy).length;
  for (const lehti of VALILEHDET) {
    const b = el("button", "valilehti");
    b.type = "button";
    const kuori = el("span");
    kuori.style.position = "relative";
    lisaa(kuori, ikoni(lehti.kuvake, 22));
    if (lehti.id === "kertaa" && eraantyy) {
      lisaa(kuori, el("span", "merkki", eraantyy > 99 ? "99+" : String(eraantyy)));
    }
    lisaa(b, kuori, el("span", "teksti", lehti.nimi));
    if (lehti.id === valilehti) b.setAttribute("aria-current", "page");
    b.addEventListener("click", () => vaihdaValilehti(lehti.id));
    lisaa(palkki, b);
  }
}

function piirraYlapalkki() {
  const nimi = $("#palkin-nimi");
  const lisa = $("#palkin-lisa");
  lisa.textContent = "";
  const asetusNappi = $("#asetukset-nappi");
  asetusNappi.hidden = false;

  if (valilehti === "teoria") {
    nimi.hidden = true;
    const haku = el("div", "hakupalkki");
    const luuppi = ikoni('<circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.6-3.6"/>', 17);
    luuppi.classList.add("luuppi");
    const kentta = el("input");
    kentta.type = "search";
    kentta.placeholder = "Hae ruotsista tai suomesta";
    kentta.value = teoriaHaku;
    kentta.setAttribute("aria-label", "Hae sanastosta");
    let ajastin = null;
    kentta.addEventListener("input", () => {
      clearTimeout(ajastin);
      // Lyhyt viive vain siksi, ettei koko sanasto piirry joka näppäimestä.
      ajastin = setTimeout(() => { teoriaHaku = kentta.value; piirraSisalto(); }, 120);
    });
    lisaa(haku, luuppi, kentta);
    if (teoriaHaku) {
      const tyhjenna = el("button", "kuvakenappi tyhjenna");
      tyhjenna.type = "button";
      tyhjenna.setAttribute("aria-label", "Tyhjennä haku");
      lisaa(tyhjenna, ikoni('<path d="M18 6 6 18M6 6l12 12"/>', 16));
      tyhjenna.addEventListener("click", () => { teoriaHaku = ""; piirraYlapalkki(); piirraSisalto(); });
      lisaa(haku, tyhjenna);
    }
    lisa.style.flex = "1";
    lisaa(lisa, haku);
  } else {
    nimi.hidden = false;
    lisa.style.flex = "";
    const lehti = VALILEHDET.find((v) => v.id === valilehti);
    let teksti = lehti.nimi;
    if (harjoitusValinta) teksti = harjoitusValinta.otsikko;
    else if (kertausIstunto?.otsikko) {
      teksti = kertausIstunto.otsikko
        + (kertausIstunto.tilanNimi ? " · " + kertausIstunto.tilanNimi : "");
    }
    else if (harjoitusIstunto) teksti = harjoitusIstunto.maaritys.nimi;
    else if (edistyminen.asetukset.suodatin) teksti = lehti.nimi + " · " + suodattimenNimi();
    $(".nimi", nimi).textContent = teksti;
  }
}

function piirraSisalto() {
  const sisalto =
    valilehti === "opi" ? naytaOpi() :
    valilehti === "kertaa" ? naytaKertaa() :
    valilehti === "harjoitukset" ? naytaHarjoitukset() :
    naytaTeoria();

  naytto.textContent = "";
  naytto.appendChild(sisalto);

  if (valilehti === "teoria" && teoriaKohdistus) {
    const kohde = document.getElementById("sana-" + teoriaKohdistus);
    teoriaKohdistus = null;
    if (kohde) {
      kohde.scrollIntoView({ behavior: "auto", block: "center" });
      korostaHetkeksi(kohde);
    }
  }
}

function korostaHetkeksi(solmu) {
  if (kevytLiike.matches) return;
  const jousi = new Jousi(0, {
    vaimennus: 1, vaste: 0.5,
    onPaivitys: (arvo) => {
      const voima = Math.sin(Math.min(arvo, 1) * Math.PI);
      solmu.style.backgroundColor = `color-mix(in srgb, var(--korostus-pehmea) ${voima * 100}%, transparent)`;
    },
    onValmis: () => { solmu.style.backgroundColor = ""; },
  });
  jousi.kohti(1);
}

function piirra() {
  piirraYlapalkki();
  piirraAlapalkki();
  piirraSisalto();
}

function vaihdaValilehti(uusi) {
  if (uusi === valilehti) {
    // Jo valitun välilehden painallus kelaa alkuun – pitkässä teoriassa se on
    // nopein tapa palata sisällysluetteloon.
    sijainnit[valilehti] = 0;
    // Pehmeä kelaus kolmea ruutua pidemmältä matkalta kestäisi sekunteja ja
    // näyttäisi hidastelulta, joten pitkä matka hypätään.
    const pitka = window.scrollY > window.innerHeight * 3;
    window.scrollTo({ top: 0, behavior: (pitka || kevytLiike.matches) ? "auto" : "smooth" });
    return;
  }
  sijainnit[valilehti] = window.scrollY;
  valilehti = uusi;
  try { localStorage.setItem(AVAIN_VALILEHTI, uusi); } catch (virhe) { /* ei kriittinen */ }
  // Kun tullaan tietyn sanan kohdalle, näkymä vierittää sinne itse. Tallennetun
  // sijainnin palauttaminen kumoaisi sen, joten se ohitetaan.
  const kohdistetaan = uusi === "teoria" && teoriaKohdistus;
  piirra();
  if (!kohdistetaan) window.scrollTo(0, sijainnit[uusi] || 0);
  naytto.focus({ preventScroll: true });
}

/* ==========================================================================
   16. Käynnistys
   ========================================================================== */
$("#asetukset-nappi").addEventListener("click", avaaAsetukset);

fetch("sanasto.json")
  .then((vastaus) => {
    if (!vastaus.ok) throw new Error("HTTP " + vastaus.status);
    return vastaus.json();
  })
  .then((data) => {
    sanasto = data;
    // Edistyminen ensin: omat sanat sijoitetaan lukurakenteeseen ennen kuin
    // sanat kerätään ja kortit johdetaan.
    lataaEdistyminen();
    for (const sana of edistyminen.omatSanat || []) sijoitaSana(sana);
    rakennaSanastoUudelleen();
    try {
      const tallennettu = localStorage.getItem(AVAIN_VALILEHTI);
      if (VALILEHDET.some((v) => v.id === tallennettu)) valilehti = tallennettu;
    } catch (virhe) { /* ei kriittinen */ }

    piirra();
  })
  .catch((virhe) => {
    naytto.textContent = "";
    lisaa(naytto, tyhjaNakyma("Sanastoa ei saatu ladattua",
      String(virhe) + ". Sivu pitää avata palvelimen kautta, ei suoraan tiedostona.", null, "!"));
  });
</script>
