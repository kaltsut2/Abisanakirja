<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f5fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#04203f" media="(prefers-color-scheme: dark)">
<title>Abisanakirja</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikoni-64-v1.png" sizes="64x64" type="image/png">
<link rel="icon" href="ikoni-192-v1.png" sizes="192x192" type="image/png">
<!-- Safari välimuistittaa kotinäytön ikonin tiedostonimen mukaan eikä huomaa
     sisällön muuttumista. Kun ikoni vaihdetaan, nosta versionumero näissä
     nimissä, manifest.webmanifest-tiedostossa ja tyokalut/tee_ikonit.sh:ssä. -->
<link rel="apple-touch-icon" href="ikoni-180-v1.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Abisanakirja">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ==========================================================================
   1. Perusta – värit, tila ja typografia
   ========================================================================== */
:root {
  color-scheme: light dark;

  --muste:        #11202f;
  --muste-2:      #4c5f74;
  --muste-3:      #7789a0;
  --tausta:       #f1f5fb;
  --pinta:        #ffffff;
  --pinta-2:      #e7eef8;
  --lasi:         rgba(241, 245, 251, 0.74);
  --lasi-reuna:   rgba(255, 255, 255, 0.7);
  --viiva:        #d9e2ef;
  --viiva-vahva:  #c3d0e2;

  /* Sininen kantaa käyttöliittymän. Syvä sävy kantaa tekstin ja täytöt, koska
     kirkas #1e96fc jää valkoista vasten alle luettavan kontrastin; kirkas sävy
     saa työkseen ne kohdat, joissa väri on pintaa eikä tekstiä. */
  --korostus:     #00509d;
  --korostus-2:   #00509d;
  --korostus-kirkas: #1e96fc;
  --korostus-syva:   #003f88;
  --korostus-pehmea: rgba(30, 150, 252, 0.12);
  --huomio:       #ffc600;
  --huomio-teksti: #6b4f00;   /* kirkas keltainen ei erotu valkoisesta */
  --oikein:       #1a7f4b;
  --oikein-pehmea: rgba(26, 127, 75, 0.1);
  --vaarin:       #c0362c;
  --vaarin-pehmea: rgba(192, 54, 44, 0.09);
  --melkein:      #a86616;
  --melkein-pehmea: rgba(168, 102, 22, 0.11);

  --liike-ulos:      cubic-bezier(0.23, 1, 0.32, 1);   /* saapuminen ja poistuminen */
  --liike-painallus: cubic-bezier(0.2, 0, 0.2, 1);      /* painalluspalaute */

  --luokka-verbi:        #82e1df;
  --luokka-substantiivi: #a486d5;
  --luokka-adjektiivi:   #fa442a;
  --luokka-adverbi:      #6fcf5f;
  --luokka-prepositio:   #ff65b3;
  --luokka-ilmaus:       #ffc600;
  --luokka-neutraali:    #9aa0a6;

  --nappi-tayte:  #003f88;
  --nappi-teksti: #ffffff;

  --pyoristys:    16px;
  --pyoristys-s:  11px;
  --varjo:        0 1px 2px rgba(28, 27, 25, 0.05), 0 8px 24px -12px rgba(28, 27, 25, 0.18);
  --varjo-nostettu: 0 2px 6px rgba(28, 27, 25, 0.07), 0 20px 48px -16px rgba(28, 27, 25, 0.3);

  --ylapalkki:    3.25rem;
  --alapalkki:    3.5rem;
  --leveys:       40rem;
}
@media (prefers-color-scheme: dark) {
  :root {
    --nappi-tayte: #1e96fc;
    --nappi-teksti: #00294f;
    --muste:      #eaf1fa;
    --muste-2:    #a6bdd6;
    --muste-3:    #8ea8c6;
    --tausta:     #04203f;
    --pinta:      #0a2d55;
    --pinta-2:    #113a68;
    --lasi:       rgba(4, 32, 63, 0.76);
    --lasi-reuna: rgba(162, 214, 249, 0.12);
    --viiva:      #10406f;
    --viiva-vahva: #1c5490;

    --korostus:   #a2d6f9;
    --korostus-2: #a2d6f9;
    --korostus-kirkas: #1e96fc;
    --korostus-syva:   #003f88;
    --korostus-pehmea: rgba(162, 214, 249, 0.16);
    --huomio:     #ffc600;
    --huomio-teksti: #ffc600;
    --oikein:     #5fd39a;
    --oikein-pehmea: rgba(95, 211, 154, 0.13);
    --vaarin:     #ff8a80;
    --vaarin-pehmea: rgba(255, 138, 128, 0.13);
    --melkein:    #f0b866;
    --melkein-pehmea: rgba(240, 184, 102, 0.14);

    --varjo:      0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -12px rgba(0, 0, 0, 0.7);
    --varjo-nostettu: 0 2px 6px rgba(0, 0, 0, 0.5), 0 20px 48px -16px rgba(0, 0, 0, 0.8);
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--tausta);
  color: var(--muste);
  font: 1rem/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overscroll-behavior-y: none;
}

/* Typografia: kirjainväli ja riviväli seuraavat kokoa, eivät ole vakioita. */
.t-nayttava { font-size: clamp(1.75rem, 7vw, 2.5rem); line-height: 1.08; letter-spacing: -0.025em; font-weight: 650; }
.t-otsikko  { font-size: 1.3rem;  line-height: 1.22; letter-spacing: -0.018em; font-weight: 650; }
.t-vali     { font-size: 1.05rem; line-height: 1.32; letter-spacing: -0.01em;  font-weight: 600; }
.t-pieni    { font-size: 0.875rem; line-height: 1.45; letter-spacing: 0.004em; }
.t-nano     { font-size: 0.75rem; line-height: 1.35; letter-spacing: 0.02em; font-weight: 550; }
.haalea  { color: var(--muste-2); }
.haalein { color: var(--muste-3); }

/* ==========================================================================
   2. Kromi – translusentit palkit, sisältö kulkee alta
   ========================================================================== */
.ylapalkki {
  position: fixed; inset: 0 0 auto 0; z-index: 30;
  height: calc(var(--ylapalkki) + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) 0.5rem 0 0.75rem;
  display: flex; align-items: center; gap: 0.5rem;
  background: var(--lasi);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
}
/* Pehmeä reuna kovan viivan sijaan – vain siinä missä kromi peittää sisältöä. */
.ylapalkki::after {
  content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 12px;
  background: linear-gradient(to bottom, var(--lasi), transparent);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  -webkit-mask-image: linear-gradient(to bottom, #000, transparent);
  mask-image: linear-gradient(to bottom, #000, transparent);
  pointer-events: none;
}
.ylapalkki h1 { margin: 0; flex: 1; min-width: 0; }
.ylapalkki .nimi { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.alapalkki {
  position: fixed; inset: auto 0 0 0; z-index: 30;
  display: flex;
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--lasi);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-top: 1px solid var(--lasi-reuna);
}
.alapalkki::before {
  content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 14px;
  background: linear-gradient(to top, var(--lasi), transparent);
  -webkit-mask-image: linear-gradient(to top, #000, transparent);
  mask-image: linear-gradient(to top, #000, transparent);
  pointer-events: none;
}
/* Leveällä ruudulla palkki ei veny yli sisällön leveyden. */
.alapalkki > .valilehdet { display: flex; width: 100%; max-width: var(--leveys); margin: 0 auto; }
.valilehti {
  flex: 1; min-height: var(--alapalkki); border: 0; background: none;
  color: var(--muste-3); font: inherit; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.1rem;
  padding: 0.35rem 0.2rem; -webkit-tap-highlight-color: transparent;
}
.valilehti .kuvake { width: 22px; height: 22px; display: block; }
.valilehti .teksti { font-size: 0.68rem; letter-spacing: 0.02em; font-weight: 550; }
.valilehti[aria-current="page"] { color: var(--korostus-kirkas); }
.valilehti .merkki {
  position: absolute; transform: translate(0.85rem, -0.7rem);
  min-width: 1.1rem; height: 1.1rem; padding: 0 0.25rem;
  border-radius: 999px; background: var(--huomio); color: #3d2f00;
  font-size: 0.65rem; font-weight: 650; line-height: 1.1rem; text-align: center;
}

main {
  max-width: var(--leveys); margin: 0 auto;
  padding: calc(var(--ylapalkki) + env(safe-area-inset-top) + 0.75rem) 1rem
           calc(var(--alapalkki) + env(safe-area-inset-bottom) + 1.5rem);
}

/* ==========================================================================
   3. Painikkeet ja kentät – palaute syntyy painalluksesta, ei irrotuksesta
   ========================================================================== */
.nappi {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
  min-height: 2.9rem; padding: 0.6rem 1.1rem;
  border: 1px solid var(--viiva-vahva); border-radius: var(--pyoristys-s);
  background: var(--pinta); color: var(--muste);
  font: inherit; font-weight: 550; cursor: pointer;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  transition: transform 120ms var(--liike-painallus), background-color 120ms linear;
}
.nappi:active { transform: scale(0.97); background: var(--pinta-2); }
.nappi.ensisijainen {
  background: var(--nappi-tayte); border-color: transparent; color: var(--nappi-teksti);
  box-shadow: 0 1px 2px rgba(0, 41, 79, 0.35);
}
.nappi.ensisijainen:active { filter: brightness(1.08); }
.nappi.leve { width: 100%; }
.nappi.hiljainen { background: none; border-color: transparent; color: var(--korostus); }
.nappi:disabled { opacity: 0.4; cursor: default; transform: none; }

.kuvakenappi {
  flex: none; width: 2.4rem; height: 2.4rem; display: grid; place-items: center;
  border: 0; border-radius: 999px; background: none; color: var(--muste-2);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: transform 120ms var(--liike-painallus), background-color 120ms linear;
}
.kuvakenappi:active { transform: scale(0.9); background: var(--pinta-2); }
.kuvakenappi svg { width: 21px; height: 21px; }

.kentta {
  width: 100%; min-height: 3.1rem; padding: 0.7rem 0.9rem;
  border: 1.5px solid var(--viiva-vahva); border-radius: var(--pyoristys-s);
  background: var(--pinta); color: var(--muste);
  font: inherit; font-size: 1.15rem; letter-spacing: -0.005em;
  transition: border-color 140ms linear, box-shadow 140ms linear;
}
.kentta:focus {
  outline: none; border-color: var(--korostus);
  box-shadow: 0 0 0 3.5px var(--korostus-pehmea);
}
.kentta::placeholder { color: var(--muste-3); }
textarea.laatikko {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.78rem; line-height: 1.45; resize: vertical; min-height: 0;
  white-space: pre; overflow-wrap: normal; overflow-x: auto;
}
.osio { padding-top: 0.9rem; border-top: 1px solid var(--viiva); }
.osio:first-of-type { border-top: 0; padding-top: 0; }

/* ==========================================================================
   4. Kortit ja tehtävänäkymät
   ========================================================================== */
.kortti {
  background: var(--pinta); border: 1px solid var(--viiva);
  border-radius: var(--pyoristys); box-shadow: var(--varjo);
  padding: 1.4rem 1.25rem;
}
.kysymys { text-align: center; padding: 1.5rem 0.5rem 1.75rem; }
.kysymys .kehote { margin: 0 0 0.6rem; color: var(--huomio-teksti); }
.kysymys .sana { margin: 0; overflow-wrap: anywhere; }
.kysymys .vihje { margin: 0.5rem 0 0; }
.kysymys .kaannos { margin: 0.65rem 0 0.9rem; }
.kysymys .vihje + .vihje { margin-top: 0.15rem; }

.vaihtoehdot { display: grid; gap: 0.55rem; }
/* Neljä vaihtoehtoa 2×2-ruudukkona: isot kohteet peukalolle, ja kaikki neljä
   näkyvät kerralla ilman että katse joutuu kulkemaan pitkää listaa alas. */
.vaihtoehdot.ruudukko { grid-template-columns: 1fr 1fr; }
.vaihtoehdot.ruudukko .vaihtoehto {
  min-height: 6.25rem; padding: 0.9rem 0.7rem; text-align: center;
  display: flex; align-items: center; justify-content: center;
  line-height: 1.32; overflow-wrap: anywhere; hyphens: auto;
}
.vaihtoehto {
  width: 100%; min-height: 3.2rem; padding: 0.75rem 1rem; text-align: left;
  border: 1.5px solid var(--viiva); border-radius: var(--pyoristys-s);
  background: var(--pinta); color: var(--muste); font: inherit; cursor: pointer;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  transition: transform 120ms var(--liike-painallus), background-color 120ms linear, border-color 140ms linear;
}
.vaihtoehto:active { transform: scale(0.985); background: var(--pinta-2); }
.vaihtoehto.oikein  { border-color: var(--oikein); background: var(--oikein-pehmea); color: var(--oikein); font-weight: 600; }
.vaihtoehto.vaarin  { border-color: var(--vaarin); background: var(--vaarin-pehmea); color: var(--vaarin); }
.vaihtoehto:disabled { cursor: default; }

/* Kenttä ja palaute jakavat saman ruudun, ja alue varaa tilaa etukäteen.
   Näin toimintonappi pysyy paikallaan eikä karkaa sormen alta. */
.vastausalue { display: grid; align-items: start; min-height: 5rem; margin-bottom: 0.75rem; }
.vastausalue > * { grid-area: 1 / 1; }
.syotteet { display: grid; gap: 0.6rem; transition: opacity 140ms var(--liike-ulos), transform 140ms var(--liike-ulos); }
.syotteet.poistuu { opacity: 0; transform: translateY(-3px); pointer-events: none; }
.kenttarivi { display: grid; gap: 0.25rem; }

.palaute { border-radius: var(--pyoristys-s); padding: 0.85rem 1rem; }
.palaute.saapuu { animation: palauteSaapuu 180ms var(--liike-ulos) both; }
@keyframes palauteSaapuu { from { opacity: 0; transform: translateY(4px); } }

/* Väärä vaihtoehto hylkää valinnan fyysisesti – väri kertoo mitä, liike että ei. */
.vaihtoehto.vaarin { animation: hylkays 280ms var(--liike-painallus); }
@keyframes hylkays {
  0%, 100% { transform: translateX(0); }
  22% { transform: translateX(-4px); }
  55% { transform: translateX(3px); }
  80% { transform: translateX(-1.5px); }
}

.edistyspalkki > i { width: 100%; transform-origin: left center; transform: scaleX(0); }

/* Päätösnäkymä on harvinainen hetki – ainoa paikka, jossa on varaa porrastukseen. */
.tyhja .porras { animation: porrasSaapuu 380ms var(--liike-ulos) both; }
@keyframes porrasSaapuu { from { opacity: 0; transform: translateY(8px); } }
.merkkiPiirto { stroke-dasharray: 32; stroke-dashoffset: 32; animation: merkkiVeto 420ms var(--liike-ulos) 120ms forwards; }
@keyframes merkkiVeto { to { stroke-dashoffset: 0; } }
.palaute.oikein  { background: var(--oikein-pehmea);  color: var(--oikein); }
.palaute.vaarin  { background: var(--vaarin-pehmea);  color: var(--vaarin); }
.palaute.melkein {
  background: color-mix(in srgb, var(--huomio) 22%, transparent);
  color: var(--huomio-teksti);
}
.palaute .otsake { font-weight: 650; }
.palaute .oikea-vastaus { color: var(--muste); font-size: 1.1rem; font-weight: 600; margin-top: 0.2rem; }
.palaute .lisa { color: var(--muste-2); margin-top: 0.35rem; }
.palaute .taivutus {
  margin-top: 0.5rem; padding-top: 0.5rem; font-size: 0.95rem; color: var(--muste);
  border-top: 1px solid color-mix(in srgb, currentColor 22%, transparent);
}
.palaute .taivutus .t-nano { color: var(--huomio-teksti); }
.palaute del { text-decoration-color: currentColor; opacity: 0.75; }

.edistyspalkki { height: 3px; border-radius: 999px; background: var(--viiva); overflow: hidden; }
.edistyspalkki > i { display: block; height: 100%; background: var(--huomio); border-radius: 999px; }

.pisteet { display: flex; gap: 0.28rem; justify-content: center; }
.pisteet i {
  width: 0.45rem; height: 0.45rem; border-radius: 999px;
  background: var(--viiva-vahva); display: block;
}
.pisteet i[data-tila="kesken"] { background: var(--huomio); transform: scale(1.25); }
.pisteet i[data-tila="valmis"] { background: var(--oikein); }

/* ==========================================================================
   5. Listat, teoria ja haku
   ========================================================================== */
.rivilista { display: grid; gap: 0.5rem; }
.rivi {
  display: flex; align-items: center; gap: 0.8rem; width: 100%; text-align: left;
  padding: 0.85rem 1rem; border: 1px solid var(--viiva); border-radius: var(--pyoristys-s);
  background: var(--pinta); color: inherit; font: inherit; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 120ms var(--liike-painallus), background-color 120ms linear;
}
.rivi:active { transform: scale(0.99); background: var(--pinta-2); }
.rivi .kasvaa { flex: 1; min-width: 0; }
.rivi .maara { color: var(--huomio-teksti); font-variant-numeric: tabular-nums; font-weight: 600; }
.rivi .nuoli { color: var(--muste-3); flex: none; }

/* Värillinen laatta rivin alussa. Väri kertoo mitä sanaluokkaa tai aihetta
   rivi koskee; hehku on laatan oma, ei koko kortin, jotta lista pysyy rauhallisena. */
.laatta {
  flex: none; width: 2.6rem; height: 2.6rem; border-radius: 0.8rem;
  display: grid; place-items: center;
  background: color-mix(in srgb, var(--laatanvari) 20%, var(--pinta));
  /* Kuvake sekoitetaan musteeseen, jotta kirkas keltainen pysyy luettavana
     vaalealla pohjalla eikä tummu liikaa tummalla. */
  color: color-mix(in srgb, var(--laatanvari) 74%, var(--muste));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--laatanvari) 34%, transparent),
              0 6px 16px -10px var(--laatanvari);
}
.laatta.numero { font-weight: 700; font-size: 0.95rem; letter-spacing: -0.02em; }
.rivi:has(.laatta) { padding: 0.7rem 0.9rem; }

/* Osaston otsikko: tunnusväri, nimi ja lukumäärä pillerissä. */
.osasto { display: flex; align-items: center; gap: 0.5rem; margin: 1.4rem 0 0.6rem; }
.osasto:first-child { margin-top: 0.25rem; }
.osasto .merkki-kuvake { color: var(--laatanvari); display: grid; place-items: center; }
.osasto .nimi { font-weight: 650; letter-spacing: -0.01em; }
.pilleri {
  font-size: 0.72rem; font-weight: 700; line-height: 1;
  padding: 0.28rem 0.5rem; border-radius: 999px;
  background: color-mix(in srgb, var(--huomio) 24%, transparent);
  color: var(--huomio-teksti);
}

h2.luku {
  display: flex; align-items: center; gap: 0.5rem;
  margin: 2.25rem 0 0.35rem; padding-top: 1rem;
  border-top: 1.5px solid var(--korostus);
  color: var(--korostus); scroll-margin-top: 5.5rem;
}
h2.luku:first-of-type { margin-top: 0.75rem; }
h3.alaluku {
  display: flex; align-items: baseline; gap: 0.6rem;
  margin: 1.6rem 0 0.5rem; color: var(--korostus-2); scroll-margin-top: 5.5rem;
}
h3.alaluku .harjoita {
  flex: none; margin-left: auto; font-size: 0.72rem; font-weight: 600;
  border: 1px solid var(--korostus); color: var(--korostus); background: none;
  border-radius: 999px; padding: 0.2rem 0.6rem; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
h3.alaluku .harjoita:active { background: var(--korostus-pehmea); }
h4.valiotsikko { margin: 1rem 0 0.3rem; color: var(--muste-2); font-size: 0.85rem; font-weight: 650; letter-spacing: 0.02em; }
p.teksti { margin: 0.4rem 0 0.9rem; color: var(--muste-2); font-size: 0.92rem; }

.sana-rivi { display: flex; gap: 0.55rem; padding: 0.45rem 0; border-bottom: 1px solid var(--viiva); }
.sana-rivi .osaaminen {
  flex: none; width: 0.45rem; height: 0.45rem; border-radius: 999px; margin-top: 0.5rem;
  background: var(--viiva-vahva);
}
.sana-rivi .osaaminen[data-tila="opittava"] { background: var(--korostus); }
.sana-rivi .osaaminen[data-tila="valmis"]   { background: var(--oikein); }
.sana-rivi .osaaminen[data-tila="vaikea"]   { background: var(--vaarin); }
.sana-rivi .sisus { flex: 1; min-width: 0; }
.sana-rivi .sv { font-weight: 600; }
.sana-rivi .muodot { font-weight: 400; color: var(--muste-2); }
.sana-rivi .fi { color: var(--muste); opacity: 0.85; font-size: 0.95rem; }
.sana-rivi .fi::before { content: "– "; color: var(--muste-3); }
.sana-rivi .vastakohta { color: var(--muste-3); margin-left: 0.4rem; font-size: 0.85rem; }
.lippu {
  font-size: 0.7rem; font-weight: 600; white-space: nowrap;
  border: 1px solid var(--viiva-vahva); color: var(--muste-3);
  border-radius: 4px; padding: 0.05rem 0.32rem; margin-left: 0.35rem;
}
.lippu[data-luokkavari] {

/* Luvun tunnusväri: pieni neliö otsikossa ja sama sävy yläviivassa. Se kertoo

.luvunvari {

/* Harjoittelutavan laatta: kuvake, nimi ja yhden rivin selite. */
.vaihtoehto.tilalaatta {
  flex-direction: column; gap: 0.35rem; min-height: 8.5rem;

}

.selite { display: flex; flex-wrap: wrap; gap: 0.35rem 0.75rem; margin: 0.2rem 0 1.25rem; }

.korjaus, .huomio { font-size: 0.85rem; margin: 0.4rem 0 0.7rem; }

}
.huomio { color: var(--muste-2); padding-left: 0.65rem; border-left: 2px dotted var(--viiva-vahva); }
.muistilista { font-size: 0.93rem; padding: 0.35rem 0; border-bottom: 1px solid var(--viiva); }

}

.hakupalkki { position: relative; flex: 1; }
.hakupalkki input {
  width: 100%; min-height: 2.3rem; padding: 0.35rem 2rem 0.35rem 2rem;
  border: 1px solid transparent; border-radius: 999px;

}

/* ==========================================================================
   6. Levy (asetukset) – himmennys erottaa, materiaali saapuu

.himmennys {

}

.kahva { width: 2.25rem; height: 0.3rem; border-radius: 999px; background: var(--viiva-vahva); margin: 0.4rem auto 0.9rem; }

.tyhja { padding: 3rem 1rem; text-align: center; }

.tyhja h2 { margin: 0 0 0.4rem; }

.pino > * + * { margin-top: 0.9rem; }

.rivi-vali { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.kytkinrivi { display: flex; align-items: flex-start; gap: 1rem; cursor: pointer; }
.kytkinrivi input { flex: none; width: 1.15rem; height: 1.15rem; margin-top: 0.15rem; accent-color: var(--korostus-kirkas); }
.napit { display: flex; gap: 0.6rem; flex-wrap: wrap; }
.napit > .nappi { flex: 1; min-width: 8rem; }

/* ==========================================================================
   7. Saavutettavuus – kevyempi vastine, ei pelkkä poisto
   ========================================================================== */
@media (prefers-reduced-transparency: reduce) {
  .ylapalkki, .alapalkki { background: var(--tausta); -webkit-backdrop-filter: none; backdrop-filter: none; }
  .ylapalkki { border-bottom: 1px solid var(--viiva); }

  /* Kevyempi vastine, ei poisto: läpinäkyvyys jää, siirtymä ja pomppu poistuvat. */

/* Näppäimistötarkennus paletin mukaisena, ei selaimen oletusrenkaana. */

<div id="levyt"></div>
<div id="ilmoitus" class="vain-ruudunlukijalle" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ==========================================================================
   1. Pikkuapurit
   ========================================================================== */
const $ = (valitsin, juuri = document) => juuri.querySelector(valitsin);

function el(tagi, luokka, teksti) {
  const solmu = document.createElement(tagi);
  if (luokka) solmu.className = luokka;
  if (teksti != null) solmu.textContent = teksti;
  return solmu;
}
function lisaa(vanhempi, ...lapset) {
  for (const lapsi of lapset) if (lapsi) vanhempi.appendChild(lapsi);
  return vanhempi;
}
function nappi(teksti, luokka, kasittelija) {
  const b = el("button", "nappi " + (luokka || ""), teksti);
  b.type = "button";
  if (kasittelija) b.addEventListener("click", kasittelija);
  return b;
}
function ikoni(polku, koko = 22) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "1.7");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("stroke-linejoin", "round");
  svg.setAttribute("width", koko);
  svg.setAttribute("height", koko);
  svg.innerHTML = polku;
  return svg;
}
function sekoita(lista) {
  const kopio = lista.slice();
  for (let i = kopio.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [kopio[i], kopio[j]] = [kopio[j], kopio[i]];
  }
  return kopio;
}
function ilmoita(teksti) { $("#ilmoitus").textContent = teksti; }

const kevytLiike = window.matchMedia("(prefers-reduced-motion: reduce)");

/* ==========================================================================
   2. Jousi – liike alkaa aina nykyisestä arvosta ja on keskeytettävissä
   --------------------------------------------------------------------------
   Vaimennussuhde 1.0 = ei ylitystä (oletus kaikelle). Alle 1.0 vain silloin,
   kun eleessä itsessään oli liike-energiaa. "Vaste" on sekunteina se, kuinka
   nopeasti arvo saavuttaa kohteen – ei kesto, jousella ei ole kestoa.
   ========================================================================== */
class Jousi {
  constructor(arvo, { vaimennus = 1, vaste = 0.4, onPaivitys, onValmis } = {}) {
    this.arvo = arvo;
    this.kohde = arvo;
    this.nopeus = 0;
    this.vaimennus = vaimennus;
    this.vaste = vaste;
    this.onPaivitys = onPaivitys;
    this.onValmis = onValmis;
    this.kahva = null;
    this.viimeksi = 0;
  }
  /* Uusi kohde ei nollaa nopeutta: liike jatkuu saumatta myös suunnanvaihdossa. */
  kohti(kohde, nopeus) {
    this.kohde = kohde;
    if (nopeus !== undefined) this.nopeus = nopeus;
    if (kevytLiike.matches) {
      this.arvo = kohde; this.nopeus = 0;
      this.onPaivitys?.(this.arvo);
      this.onValmis?.();
      return;
    }
    if (!this.kahva) {
      this.viimeksi = performance.now();
      this.kahva = requestAnimationFrame(this.askel);
    }
  }
  aseta(arvo) {
    this.pysayta();
    this.arvo = this.kohde = arvo;
    this.nopeus = 0;
    this.onPaivitys?.(arvo);
  }
  pysayta() {
    if (this.kahva) cancelAnimationFrame(this.kahva);
    this.kahva = null;
  }
  askel = (nyt) => {
    const dt = Math.min((nyt - this.viimeksi) / 1000, 1 / 30);
    this.viimeksi = nyt;
    const w = (2 * Math.PI) / this.vaste;
    const k = w * w;
    const c = 2 * this.vaimennus * w;
    // Puolittainen aika-askel pitää integroinnin vakaana myös hitaalla ruudulla.
    const askeleita = Math.max(1, Math.ceil(dt / (1 / 240)));
    const h = dt / askeleita;
    for (let i = 0; i < askeleita; i++) {
      const kiihtyvyys = -k * (this.arvo - this.kohde) - c * this.nopeus;
      this.nopeus += kiihtyvyys * h;
      this.arvo += this.nopeus * h;
    }
    this.onPaivitys?.(this.arvo);
    if (Math.abs(this.arvo - this.kohde) < 0.0015 && Math.abs(this.nopeus) < 0.02) {
      this.arvo = this.kohde;
      this.nopeus = 0;
      this.kahva = null;
      this.onPaivitys?.(this.arvo);
      this.onValmis?.();
      return;
    }
    this.kahva = requestAnimationFrame(this.askel);
  };
}

/* ==========================================================================
   3. Sanasto ja korttien johtaminen
   ========================================================================== */
const SUUNNAT = { SVFI: "sv→fi", FISV: "fi→sv" };

let sanasto = null;
let kaikkiSanat = [];          // luettelojärjestyksessä
let sanatTunnuksella = new Map();
let kortit = [];
let kortitTunnuksella = new Map();
let kortitSanalla = new Map(); // sanan id -> [kortti, kortti]

function kortinTunnus(sana, suunta) { return sana.id + ":" + suunta; }

function keraaSanat(data) {
  const sanat = [];
  for (const luku of data.luvut) {
    for (const alaluku of luku.alaluvut) {
      for (const kohta of alaluku.sisalto) {
        if (kohta.tyyppi === "sana") {
          kohta._luku = luku.otsikko;
          kohta._alaluku = alaluku.otsikko;
          sanat.push(kohta);
        }
      }
    }
  }
  return sanat;
}

/* ==========================================================================
   3b. Omat sanat – JSONilla lisätyt, localStoragessa elävät sanat
   --------------------------------------------------------------------------
   Sanasto itse on kiinteä tiedosto repossa. Omat sanat ovat sen päälle tuleva
   kerros: ne sijoitetaan samaan lukurakenteeseen joka latauksella, joten ne
   näkyvät Teoriassa oikeassa kohdassa ja tuottavat kortteja kuten muutkin.
   ========================================================================== */
const OMA_ETULIITE = "oma-";

/* Hyväksyy kolme muotoa: koko dokumentin (\{luvut: […]\}), listan sanoja tai
   yhden sanan. Näin sanastodumpin tuloste kelpaa sellaisenaan. */
function jasennaSanaSyote(teksti) {
  const data = JSON.parse(teksti);
  const kerätyt = [];
  if (data && Array.isArray(data.luvut)) {
    for (const luku of data.luvut) {
      for (const alaluku of luku.alaluvut || []) {
        for (const kohta of alaluku.sisalto || []) {
          if (kohta && kohta.tyyppi === "sana") {
            kerätyt.push(Object.assign({
              kategoria: luku.otsikko, alakategoria: alaluku.otsikko,
            }, kohta));
          }
        }
      }
    }
  } else if (Array.isArray(data)) {
    kerätyt.push(...data);
  } else if (data && typeof data === "object") {
    kerätyt.push(data);
  }
  return kerätyt.map(normalisoiOmaSana).filter(Boolean);
}

function normalisoiOmaSana(raaka) {
  if (!raaka || typeof raaka !== "object") return null;
  const ruotsi = String(raaka.ruotsi ?? raaka.sv ?? "").trim();
  let suomi = raaka.suomi ?? raaka.fi ?? [];
  if (typeof suomi === "string") suomi = suomi.split(",").map((o) => o.trim());
  suomi = (Array.isArray(suomi) ? suomi : []).map((o) => String(o).trim()).filter(Boolean);
  if (!ruotsi || !suomi.length) return null;

  let taivutus = raaka.taivutus ?? [];
  if (typeof taivutus === "string") taivutus = taivutus.split(",").map((o) => o.trim());
  const esimerkit = (Array.isArray(raaka.esimerkit) ? raaka.esimerkit : [])
    .map((e) => ({ sv: e && e.sv ? String(e.sv) : null, fi: e && e.fi ? String(e.fi) : null }))
    .filter((e) => e.sv);

  return {
    tyyppi: "sana",
    id: OMA_ETULIITE + Math.random().toString(36).slice(2, 9),
    sanaluokka: raaka.sanaluokka || "ilmaus",
    ruotsi,
    suomi,
    taivutus: (Array.isArray(taivutus) ? taivutus : []).map(String).filter(Boolean),
    luokka: raaka.luokka ?? null,
    suku: raaka.suku ?? null,
    kategoria: raaka.kategoria ?? null,
    alakategoria: raaka.alakategoria ?? null,
    valiotsikko: null,
    vastakohta: null,
    rektio: raaka.rektio ?? null,
    esimerkit,
    muistiinpano: raaka.muistiinpano ?? null,
    paallekkainen: false,
    oma: true,
  };
}

const OMA_LUKU = "Omat sanat";

/* Sijoittaa sanan lukurakenteeseen: olemassa olevaan alalukuun jos nimi
   täsmää, muuten omaan lukuunsa. Palauttaa alaluvun otsikon. */
function sijoitaSana(sana) {
  const etsiLuku = (otsikko) => sanasto.luvut.find((l) => l.otsikko === otsikko);
  let luku = sana.kategoria ? etsiLuku(sana.kategoria) : null;
  let alaluku = null;
  if (luku && sana.alakategoria) {
    alaluku = luku.alaluvut.find((a) => a.otsikko === sana.alakategoria);
  }
  if (!alaluku && sana.alakategoria) {
    for (const l of sanasto.luvut) {
      const osuma = l.alaluvut.find((a) => a.otsikko === sana.alakategoria);
      if (osuma) { luku = l; alaluku = osuma; break; }
    }
  }
  if (!alaluku) {
    luku = etsiLuku(OMA_LUKU);
    if (!luku) { luku = { otsikko: OMA_LUKU, alaluvut: [] }; sanasto.luvut.push(luku); }
    const nimi = sana.alakategoria || "Lisätyt sanat";
    alaluku = luku.alaluvut.find((a) => a.otsikko === nimi);
    if (!alaluku) { alaluku = { otsikko: nimi, sisalto: [] }; luku.alaluvut.push(alaluku); }
  }
  alaluku.sisalto.push(sana);
  sana.kategoria = luku.otsikko;
  sana.alakategoria = alaluku.otsikko;
  return alaluku.otsikko;
}

function poistaOmatSanat(idt) {
  const poistettavat = new Set(idt);
  if (!poistettavat.size) return 0;
  for (const id of poistettavat) {
    for (const kortti of kortitSanalla.get(id) || []) delete edistyminen.kortit[kortti.id];
  }
  edistyminen.omatSanat = edistyminen.omatSanat.filter((s) => !poistettavat.has(s.id));
  for (const luku of sanasto.luvut) {
    for (const alaluku of luku.alaluvut) {
      alaluku.sisalto = alaluku.sisalto.filter((k) => !poistettavat.has(k.id));
    }
    luku.alaluvut = luku.alaluvut.filter((a) => a.sisalto.length || luku.otsikko !== OMA_LUKU);
  }
  sanasto.luvut = sanasto.luvut.filter(
    (l) => l.otsikko !== OMA_LUKU || l.alaluvut.some((a) => a.sisalto.length));
  // Peruutuserästä pois poistetut, jottei nappi lupaa enempää kuin on jäljellä.
  const era = edistyminen.viimeisinLisays;
  if (era) {
    era.idt = era.idt.filter((id) => !poistettavat.has(id));
    if (!era.idt.length) edistyminen.viimeisinLisays = null;
  }
  rakennaSanastoUudelleen();
  tallenna();
  return poistettavat.size;
}

function poistaOmaSana(id) { return poistaOmatSanat([id]); }

function rakennaSanastoUudelleen() {
  kaikkiSanat = keraaSanat(sanasto);
  sanatTunnuksella = new Map(kaikkiSanat.map((s) => [s.id, s]));
  kortitSanalla = new Map();
  kortit = teeKortit(kaikkiSanat);
  kortitTunnuksella = new Map(kortit.map((k) => [k.id, k]));
}

/* Kortiksi kelpaa sana, jolla on molemmat kielet eikä se toistu myöhemmästä
   luvusta. Kielioppiluvut eivät tuota kortteja lainkaan. */
function kelpaaKortiksi(sana) {
  return !sana.paallekkainen
    && sana.ruotsi && sana.suomi.length
    && !/^7 /.test(sana.kategoria || "");
}

function teeKortit(sanat) {
  const tulos = [];
  for (const sana of sanat) {
    if (!kelpaaKortiksi(sana)) continue;
    const pari = [];
    for (const suunta of [SUUNNAT.SVFI, SUUNNAT.FISV]) {
      const kortti = { id: kortinTunnus(sana, suunta), sana, suunta };
      tulos.push(kortti);
      pari.push(kortti);
    }
    kortitSanalla.set(sana.id, pari);
  }
  return tulos;
}

/* ==========================================================================
   4. Vastausten hyväksyminen
   ========================================================================== */
function normalisoi(teksti) {
  return teksti
    .toLowerCase()
    .normalize("NFC")
    .replace(/\([^)]*\)/g, " ")
    .replace(/[.,!?;:…"'’„”]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}
function riisuTarkkeet(teksti) {
  return teksti.replace(/[åä]/g, "a").replace(/ö/g, "o")
               .replace(/é/g, "e").replace(/ü/g, "u").replace(/ø/g, "o");
}

function hyvaksytytVastaukset(sana, suunta) {
  const joukko = new Set();
  const lisaaMuoto = (teksti) => {
    const siisti = teksti.trim();
    if (siisti) joukko.add(siisti);
  };
  if (suunta === SUUNNAT.FISV) {
    for (const osa of sana.ruotsi.split(" / ")) {
      lisaaMuoto(osa);
      // Artikkeli saa puuttua, mutta väärä artikkeli ei kelpaa.
      if (sana.suku && !/^(en|ett)\s/.test(osa)) lisaaMuoto(sana.suku + " " + osa);
    }
  } else {
    for (const merkitys of sana.suomi) {
      for (const osa of merkitys.split(" / ")) lisaaMuoto(osa);
    }
  }
  return [...joukko];
}

/* Palauttaa "oikein" | "melkein" | "vaarin".
   "melkein" = oikea kirjainjono mutta å/ä/ö kirjoitettu a/o:na. Sitä ei
   hyväksytä, koska kokeessa se on virhe – mutta palaute kertoo syyn. */
function tarkistaVastaus(kirjoitettu, sana, suunta) {
  const vastaus = normalisoi(kirjoitettu);
  if (!vastaus) return { tulos: "vaarin", oikeat: hyvaksytytVastaukset(sana, suunta) };
  const oikeat = hyvaksytytVastaukset(sana, suunta);
  for (const oikea of oikeat) {
    if (vastaus === normalisoi(oikea)) return { tulos: "oikein", osuma: oikea, oikeat };
  }
  for (const oikea of oikeat) {
    if (riisuTarkkeet(vastaus) === riisuTarkkeet(normalisoi(oikea))) {
      return { tulos: "melkein", osuma: oikea, oikeat, syy: "tarkkeet" };
    }
  }
  return { tulos: "vaarin", oikeat };
}

/* ==========================================================================
   5. Edistyminen – localStorage, korttikohtaisesti
   ========================================================================== */
const AVAIN = "ruotsi.edistyminen.v1";
const PAIVA = 86400000;

const oletusEdistyminen = () => ({
  versio: 1,
  kortit: {},
  virheloki: [],
  asetukset: { aani: true, aaninimi: null, suodatin: null, naytaLuokka: true },
  istunto: { paiva: null, maara: 0 },
  omatSanat: [],
  viimeisinLisays: null,   // { aika, idt: [] } – peruutusta varten
});

let edistyminen = oletusEdistyminen();
let tallennusOdottaa = null;

function lataaEdistyminen() {
  try {
    const raaka = localStorage.getItem(AVAIN);
    if (!raaka) return;
    const data = JSON.parse(raaka);
    if (data && data.versio === 1) {
      edistyminen = Object.assign(oletusEdistyminen(), data);
      edistyminen.asetukset = Object.assign(oletusEdistyminen().asetukset, data.asetukset || {});
    }
  } catch (virhe) {
    console.warn("Edistymistä ei voitu lukea:", virhe);
  }
}
function tallenna() {
  clearTimeout(tallennusOdottaa);
  tallennusOdottaa = setTimeout(() => {
    try {
      localStorage.setItem(AVAIN, JSON.stringify(edistyminen));
    } catch (virhe) {
      console.warn("Edistymistä ei voitu tallentaa:", virhe);
    }
  }, 250);
}

const uusiTila = (kortinId) => ({
  cardId: kortinId, stage: 0, graduated: false,
  interval: 0, easeFactor: 2.5, repetitions: 0,
  nextReview: null, lapses: 0, virheita: 0, nahty: 0,
});

function tila(kortti) { return edistyminen.kortit[kortti.id] || null; }
function tilaTaiUusi(kortti) {
  let t = edistyminen.kortit[kortti.id];
  if (!t) { t = uusiTila(kortti.id); edistyminen.kortit[kortti.id] = t; }
  return t;
}
const onAloittamaton = (kortti) => !edistyminen.kortit[kortti.id];
const onValmistunut = (kortti) => Boolean(tila(kortti)?.graduated);

function tanaan() {
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
}
function erääntyy(kortti) {
  const t = tila(kortti);
  return Boolean(t?.graduated) && (t.nextReview == null || t.nextReview <= tanaan());
}

/* SM-2. Laatu: 5 = oikein, 2 = tarkkeet väärin, 0 = väärin. */
function paivitaValitoisto(t, laatu) {
  if (laatu >= 3) {
    t.repetitions += 1;
    if (t.repetitions === 1) t.interval = 1;
    else if (t.repetitions === 2) t.interval = 6;
    else t.interval = Math.round(t.interval * t.easeFactor);
  } else {
    t.repetitions = 0;
    t.interval = 1;
    t.lapses += 1;
  }
  const muutos = 0.1 - (5 - laatu) * (0.08 + (5 - laatu) * 0.02);
  t.easeFactor = Math.max(1.3, Math.round((t.easeFactor + muutos) * 1000) / 1000);
  t.nextReview = tanaan() + t.interval * PAIVA;
}

function kirjaaVirhe(kortti, kirjoitettu, oikea) {
  edistyminen.virheloki.unshift({
    aika: Date.now(), kortti: kortti.id,
    sana: kortti.sana.ruotsi, suunta: kortti.suunta,
    kirjoitettu: kirjoitettu.trim().slice(0, 80), oikea,
  });
  edistyminen.virheloki = edistyminen.virheloki.slice(0, 200);
}

const LEECH_RAJA = 5;
const onLeech = (kortti) => (tila(kortti)?.virheita || 0) >= LEECH_RAJA;

/* ==========================================================================
   6. Näkymän rungot – yhteiset palikat kaikille tehtävätyypeille
   ========================================================================== */
const naytto = $("#naytto");

function kysymysLohko(kehote, teksti, vihje, puhuttava) {
  const lohko = el("div", "kysymys");
  lisaa(lohko, el("p", "kehote t-nano haalein", kehote.toUpperCase()));
  lisaa(lohko, el("p", "sana t-nayttava", teksti));
  if (vihje) lisaa(lohko, el("p", "vihje t-pieni haalea", vihje));
  const aani = puhuttava ? aaninappi(puhuttava) : null;
  if (aani) { aani.style.margin = "0.5rem auto 0"; lisaa(lohko, aani); }
  return lohko;
}

function tekstikentta(paikanpitaja) {
  const kentta = el("input", "kentta");
  kentta.type = "text";
  if (paikanpitaja) kentta.placeholder = paikanpitaja;
  kentta.autocomplete = "off";
  kentta.autocapitalize = "off";
  kentta.autocorrect = "off";
  kentta.spellcheck = false;
  kentta.enterKeyHint = "done";
  return kentta;
}

/* Yksi lomake kaikkeen kirjoittamiseen.

   Vastauskenttä ja palaute jakavat saman ruudun, ja toimintonappi pysyy koko
   ajan samassa kohdassa: se vain vaihtaa nimensä. Näin sormi ei osu tyhjään
   siinä hetkessä, kun palaute ilmestyy. Nappi on lukossa 320 ms vastauksen
   paljastuttua, jottei pohjaan jäänyt Enter ohita palautetta. */
function vastauslomake({ paikanpitaja, kentat, onTarkista, onJatka }) {
  const muoto = el("form");
  const alue = el("div", "vastausalue");
  const syotelohko = el("div", "syotteet");
  const syotteet = [];

  if (kentat) {
    for (const maaritys of kentat) {
      const rivi = el("label", "kenttarivi");
      lisaa(rivi, el("span", "t-nano haalein", maaritys.otsikko.toUpperCase()));
      const kentta = tekstikentta();
      lisaa(rivi, kentta);
      lisaa(syotelohko, rivi);
      syotteet.push(kentta);
    }
  } else {
    const kentta = tekstikentta(paikanpitaja);
    lisaa(syotelohko, kentta);
    syotteet.push(kentta);
  }
  lisaa(alue, syotelohko);

  const toiminto = nappi("Tarkista", "ensisijainen leve");
  toiminto.type = "submit";
  lisaa(muoto, alue, toiminto);

  let vaihe = "kysyy";
  muoto.addEventListener("submit", (tapahtuma) => {
    tapahtuma.preventDefault();
    if (vaihe === "kysyy") {
      const tulos = onTarkista(syotteet.map((k) => k.value));
      const palaute = palautelohko(tulos.tulos, tulos.oikea, tulos.lisatieto,
                                   tulos.kirjoitettu, tulos.taivutus);
      palaute.classList.add("saapuu");
      lisaa(alue, palaute);
      syotelohko.classList.add("poistuu");
      for (const kentta of syotteet) kentta.disabled = true;
      toiminto.textContent = "Jatka";
      toiminto.disabled = true;
      vaihe = "lukossa";
      setTimeout(() => {
        vaihe = "jatkaa";
        toiminto.disabled = false;
        toiminto.focus();
      }, kevytLiike.matches ? 0 : 320);
    } else if (vaihe === "jatkaa") {
      onJatka();
    }
  });

  muoto._kentat = syotteet;
  return muoto;
}

/* Edistyspalkki lähtee aina siitä, mihin se viimeksi jäi. */
const edistysArvot = new Map();
function edistyspalkki(avain, osuus) {
  const palkki = el("div", "edistyspalkki");
  const tayte = el("i");
  const edellinen = edistysArvot.get(avain) ?? 0;
  edistysArvot.set(avain, osuus);
  tayte.style.transform = `scaleX(${edellinen})`;
  lisaa(palkki, tayte);
  if (kevytLiike.matches || Math.abs(osuus - edellinen) < 0.001) {
    tayte.style.transform = `scaleX(${osuus})`;
  } else {
    const jousi = new Jousi(edellinen, {
      vaimennus: 1, vaste: 0.45,
      onPaivitys: (arvo) => { tayte.style.transform = `scaleX(${arvo})`; },
    });
    requestAnimationFrame(() => jousi.kohti(osuus));
  }
  return palkki;
}

/* Pieni pomppu: ainoa paikka, jossa ylitys on ansaittu, koska jotain valmistui. */
function pomppaa(solmu) {
  if (kevytLiike.matches) return;
  const jousi = new Jousi(1.6, {
    vaimennus: 0.55, vaste: 0.32,
    onPaivitys: (arvo) => { solmu.style.transform = `scale(${arvo})`; },
    onValmis: () => { solmu.style.transform = ""; },
  });
  jousi.kohti(1);
}

function vaihtoehtolohko(vaihtoehdot, onValinta) {
  // Parillinen määrä asettuu ruudukkoon, pariton pysyy listana.
  const ruudukko = vaihtoehdot.length === 2 || vaihtoehdot.length === 4;
  const lohko = el("div", "vaihtoehdot" + (ruudukko ? " ruudukko" : ""));
  for (const teksti of vaihtoehdot) {
    const b = el("button", "vaihtoehto", teksti);
    b.type = "button";
    b.addEventListener("click", () => onValinta(teksti, lohko));
    lisaa(lohko, b);
  }
  return lohko;
}

function palautelohko(tulos, oikea, lisatieto, kirjoitettu, taivutus) {
  const lohko = el("div", "palaute " + tulos);
  const otsakkeet = {
    oikein: "Oikein",
    melkein: "Melkein – tarkista ä/ö/å",
    vaarin: "Väärin",
  };
  lisaa(lohko, el("div", "otsake", otsakkeet[tulos]));
  if (tulos !== "oikein") {
    if (kirjoitettu && kirjoitettu.trim()) {
      const rivi = el("div", "t-pieni");
      const yli = el("del", null, kirjoitettu.trim());
      lisaa(rivi, yli);
      lisaa(lohko, rivi);
    }
    lisaa(lohko, el("div", "oikea-vastaus", oikea));
  }
  if (taivutus) {
    const rivi = el("div", "taivutus");
    lisaa(rivi, el("span", "t-nano haalein", "TAIVUTUS "));
    lisaa(rivi, el("span", null, taivutus));
    lisaa(lohko, rivi);
  }
  if (lisatieto) lisaa(lohko, el("div", "lisa t-pieni", lisatieto));
  return lohko;
}

/* Koko paradigma yhtenä rivinä: perusmuoto artikkeleineen ja kaikki muodot.
   Näytetään jokaisen tehtävätyypin palautteessa riippumatta siitä, meniko
   vastaus oikein: hetki vastauksen jälkeen on se, jolloin muodot tarttuvat.
   Palauttaa null, jos sanalla ei ole taivutusmuotoja lähteessä. */
function taivutusMuodot(sana) {
  if (!sana.taivutus.length) return null;
  const alku = (sana.suku ? sana.suku + " " : "") + sana.ruotsi;
  return [alku, ...sana.taivutus].join(" · ");
}

/* Sanan konteksti: mistä luvusta se on ja mitä siihen liittyy. */
function sanavihje(sana) {
  const osat = [];
  if (sana.sanaluokka) osat.push(sana.sanaluokka);
  if (sana.luokka) osat.push(sana.luokka);
  return osat.join(" · ");
}

function hakusana(sana) {
  const alku = (sana.suku ? sana.suku + " " : "") + sana.ruotsi;
  return sana.taivutus.length ? alku + ", " + sana.taivutus.join(", ") : alku;
}

/* ==========================================================================
   7. Häiriövaihtoehdot – läheltä, ei satunnaisesti koko sanastosta
   ========================================================================== */
function vastausTeksti(sana, suunta) {
  return suunta === SUUNNAT.FISV ? sana.ruotsi : sana.suomi[0];
}
/* Monivalinnassa selittävä sulkulisäys paljastaisi oikean vastauksen
   pituudellaan, joten vaihtoehdot näytetään ilman sitä. */
function lyhytVastaus(sana, suunta) {
  return vastausTeksti(sana, suunta).replace(/\s*\([^)]*\)/g, "").trim();
}
function kysymysTeksti(sana, suunta) {
  return suunta === SUUNNAT.FISV ? sana.suomi.join(", ") : hakusana(sana);
}

function hairiot(sana, suunta, maara = 3) {
  const kaytetty = new Set([lyhytVastaus(sana, suunta)]);
  const tulos = [];
  const lisaaEhdokkaat = (ehdokkaat) => {
    for (const ehdokas of sekoita(ehdokkaat)) {
      if (tulos.length >= maara) return;
      if (ehdokas === sana || !kelpaaKortiksi(ehdokas)) continue;
      const teksti = lyhytVastaus(ehdokas, suunta);
      if (!teksti || kaytetty.has(teksti)) continue;
      kaytetty.add(teksti);
      tulos.push(teksti);
    }
  };
  // Vastakohta on paras mahdollinen häiriö: se pakottaa erottamaan parin.
  if (sana.vastakohta && sanatTunnuksella.has(sana.vastakohta)) {
    lisaaEhdokkaat([sanatTunnuksella.get(sana.vastakohta)]);
  }
  lisaaEhdokkaat(kaikkiSanat.filter((s) => s._alaluku === sana._alaluku));
  if (tulos.length < maara) lisaaEhdokkaat(kaikkiSanat.filter((s) => s._luku === sana._luku));
  if (tulos.length < maara) lisaaEhdokkaat(kaikkiSanat.filter((s) => s.sanaluokka === sana.sanaluokka));
  if (tulos.length < maara) lisaaEhdokkaat(kaikkiSanat);
  return tulos;
}

/* ==========================================================================
   8. Opi – uuden sanan sisäänajo erissä
   ========================================================================== */
const ERAN_KOKO = 7;
const VAIHEET = [
  { nimi: "Esittely",   ohje: "Katso ja lue" },
  { nimi: "Tunnistus",  ohje: "Ruotsi → suomi" },
  { nimi: "Suunnanvaihto", ohje: "Suomi → ruotsi" },
  { nimi: "Palautus",   ohje: "Kirjoita suomeksi" },
  { nimi: "Tuottaminen", ohje: "Kirjoita ruotsiksi" },
];

let oppiIstunto = null;

function uusiaSanoja(suodatettu = true) {
  const joukko = suodatettu ? suodatetutSanat() : kaikkiSanat;
  return joukko.filter((sana) => {
    const pari = kortitSanalla.get(sana.id);
    return pari && pari.every(onAloittamaton);
  });
}

function aloitaEra(sanat) {
  const era = sanat.slice(0, ERAN_KOKO).map((sana) => {
    for (const kortti of kortitSanalla.get(sana.id)) {
      const t = tilaTaiUusi(kortti);
      t.stage = 0;
    }
    return { sana, vaihe: 0, perakkaisetVirheet: 0, valmis: false };
  });
  oppiIstunto = { kohteet: era, viimeksi: [], nykyinen: null, naytaVastaus: false, pompatut: new Set() };
  tallenna();
  seuraavaOppiKohde();
}

function seuraavaOppiKohde() {
  const kesken = oppiIstunto.kohteet.filter((k) => !k.valmis);
  if (!kesken.length) { oppiIstunto.nykyinen = null; return; }
  // Samaa sanaa ei kysytä kahdesti peräkkäin: väliin vähintään kaksi muuta.
  let ehdokkaat = kesken.filter((k) => !oppiIstunto.viimeksi.includes(k.sana.id));
  if (!ehdokkaat.length) ehdokkaat = kesken.filter((k) => k.sana.id !== oppiIstunto.viimeksi[0]);
  if (!ehdokkaat.length) ehdokkaat = kesken;
  // Alimmasta vaiheesta eteenpäin, jotta erä etenee tasaisesti.
  const alin = Math.min(...ehdokkaat.map((k) => k.vaihe));
  const valinta = sekoita(ehdokkaat.filter((k) => k.vaihe === alin))[0];
  oppiIstunto.nykyinen = valinta;
  oppiIstunto.viimeksi = [valinta.sana.id, oppiIstunto.viimeksi[0]].filter(Boolean);
}

function oppiVastaus(kohde, oikein) {
  if (oikein) {
    kohde.perakkaisetVirheet = 0;
    kohde.vaihe += 1;
    if (kohde.vaihe > 4) {
      kohde.valmis = true;
      for (const kortti of kortitSanalla.get(kohde.sana.id)) {
        const t = tilaTaiUusi(kortti);
        t.stage = null;
        t.graduated = true;
        t.repetitions = 1;
        t.interval = 1;
        t.nextReview = tanaan() + PAIVA;
      }
    }
  } else {
    kohde.perakkaisetVirheet += 1;
    // Vaiheeseen 0 ei palata: esittely nähdään kerran.
    if (kohde.perakkaisetVirheet < 2) kohde.vaihe = Math.max(1, kohde.vaihe - 1);
  }
  for (const kortti of kortitSanalla.get(kohde.sana.id)) {
    const t = tilaTaiUusi(kortti);
    if (!t.graduated) t.stage = kohde.vaihe;
    t.nahty += 1;
    if (!oikein) t.virheita += 1;
  }
  tallenna();
}

function naytaOpi() {
  const uudet = uusiaSanoja();

  if (!oppiIstunto) {
    const lohko = el("div", "pino");
    if (!uudet.length) {
      lisaa(lohko, tyhjaNakyma("Kaikki sanat aloitettu",
        "Jokainen sanasto­kohta on käynyt Opi-putken läpi. Loppu tapahtuu Kertaa-välilehdellä.",
        nappi("Siirry kertaamaan", "ensisijainen", () => vaihdaValilehti("kertaa"))));
      return lohko;
    }
    const kortti = el("div", "kortti pino");
    lisaa(kortti, el("p", "t-nano haalein", "UUSIA SANOJA"));
    lisaa(kortti, el("p", "t-nayttava", String(uudet.length)));
    lisaa(kortti, el("p", "t-pieni haalea",
      "Erässä on seitsemän sanaa – suunnilleen se määrä, jonka työmuisti pitää kerralla hallussaan. " +
      "Sanat kiertävät vaiheittain, kunnes kaikki on kirjoitettu ruotsiksi."));
    lisaa(kortti, nappi(`Aloita erä (${Math.min(ERAN_KOKO, uudet.length)} sanaa)`, "ensisijainen leve",
      () => { aloitaEra(uudet); piirra(); }));
    lisaa(lohko, kortti);
    lisaa(lohko, seuraavatSanatLista(uudet.slice(0, ERAN_KOKO)));
    return lohko;
  }

  if (!oppiIstunto.nykyinen) {
    const opitut = oppiIstunto.kohteet.map((k) => k.sana);
    oppiIstunto = null;
    const lohko = el("div", "pino");
    lisaa(lohko, tyhjaNakyma("Erä valmis",
      "Sanat siirtyivät kertaukseen ja palaavat huomenna.", null, "✓"));
    lisaa(lohko, seuraavatSanatLista(opitut, "Tämän erän sanat"));
    const napit = el("div", "napit");
    if (uusiaSanoja().length) {
      lisaa(napit, nappi("Uusi erä", "ensisijainen", () => { aloitaEra(uusiaSanoja()); piirra(); }));
    }
    lisaa(napit, nappi("Kertaa", "", () => vaihdaValilehti("kertaa")));
    lisaa(lohko, napit);
    return lohko;
  }

  const kohde = oppiIstunto.nykyinen;
  const { sana, vaihe } = kohde;
  const lohko = el("div", "pino");

  const yla = el("div", "rivi-vali");
  lisaa(yla, el("span", "t-nano haalein", VAIHEET[vaihe].nimi.toUpperCase() + " · " + VAIHEET[vaihe].ohje));
  const pisteet = el("div", "pisteet");
  for (const k of oppiIstunto.kohteet) {
    const piste = el("i");
    piste.dataset.tila = k.valmis ? "valmis" : (k === kohde ? "kesken" : "");
    if (k.valmis && !oppiIstunto.pompatut.has(k.sana.id)) {
      oppiIstunto.pompatut.add(k.sana.id);
      requestAnimationFrame(() => pomppaa(piste));
    }
    lisaa(pisteet, piste);
  }
  lisaa(yla, pisteet);
  lisaa(lohko, yla);

  const kortti = el("div", "kortti");

  if (oppiIstunto.naytaVastaus || vaihe === 0) {
    // Esittely: ei arvausta, vain sana kokonaisuudessaan.
    lisaa(kortti, esittelyLohko(sana));
    lisaa(kortti, nappi("Seuraava", "ensisijainen leve", () => {
      oppiIstunto.naytaVastaus = false;
      if (vaihe === 0) oppiVastaus(kohde, true);
      seuraavaOppiKohde();
      piirra();
    }));
  } else if (vaihe === 1 || vaihe === 2) {
    const suunta = vaihe === 1 ? SUUNNAT.SVFI : SUUNNAT.FISV;
    const oikea = lyhytVastaus(sana, suunta);
    lisaa(kortti, kysymysLohko(VAIHEET[vaihe].ohje, kysymysTeksti(sana, suunta), sanavihje(sana)));
    const vaihtoehdot = sekoita([oikea, ...hairiot(sana, suunta)]);
    lisaa(kortti, vaihtoehtolohko(vaihtoehdot, (valittu, palkki) => {
      const osui = valittu === oikea;
      for (const b of palkki.children) {
        b.disabled = true;
        if (b.textContent === oikea) b.classList.add("oikein");
        else if (b.textContent === valittu) b.classList.add("vaarin");
      }
      lisaa(kortti, palautelohko(osui ? "oikein" : "vaarin", oikea, null, null,
                                 taivutusMuodot(sana)));
      oppiVastaus(kohde, osui);
      jatkaHetkenPaasta(osui, () => {
        if (!osui && kohde.perakkaisetVirheet >= 2) oppiIstunto.naytaVastaus = true;
        else seuraavaOppiKohde();
        piirra();
      });
    }));
  } else {
    const suunta = vaihe === 3 ? SUUNNAT.SVFI : SUUNNAT.FISV;
    lisaa(kortti, kysymysLohko(VAIHEET[vaihe].ohje, kysymysTeksti(sana, suunta), sanavihje(sana)));
    let osuiViimeksi = false;
    const muoto = vastauslomake({
      paikanpitaja: suunta === SUUNNAT.FISV ? "ruotsiksi" : "suomeksi",
      onTarkista: ([arvo]) => {
        const tulos = tarkistaVastaus(arvo, sana, suunta);
        osuiViimeksi = tulos.tulos === "oikein";
        if (!osuiViimeksi) kirjaaVirhe({ id: kortinTunnus(sana, suunta), sana, suunta }, arvo, tulos.oikeat[0]);
        oppiVastaus(kohde, osuiViimeksi);
        return {
          tulos: tulos.tulos, oikea: tulos.oikeat[0], kirjoitettu: arvo,
          lisatieto: tulos.syy === "tarkkeet" ? "Kirjainmerkki ratkaisee: kokeessa tämä on virhe." : null,
          taivutus: taivutusMuodot(sana),
        };
      },
      onJatka: () => {
        if (!osuiViimeksi && kohde.perakkaisetVirheet >= 2) oppiIstunto.naytaVastaus = true;
        else seuraavaOppiKohde();
        piirra();
      },
    });
    lisaa(kortti, muoto);
    queueMicrotask(() => muoto._kentat[0].focus());
  }

  lisaa(lohko, kortti);
  lisaa(lohko, teoriaLinkki(sana));
  return lohko;
}

/* Ensikohtaaminen: sana, käännös ja taivutus yhdellä silmäyksellä, keskitettynä
   samalle akselille kuin myöhemmät kysymykset – sama paikka, eri sisältö. */
function esittelyLohko(sana) {
  const lohko = el("div", "kysymys");
  lisaa(lohko, el("p", "kehote t-nano haalein", "UUSI SANA"));
  lisaa(lohko, el("p", "sana t-nayttava", (sana.suku ? sana.suku + " " : "") + sana.ruotsi));
  lisaa(lohko, el("p", "kaannos t-otsikko", sana.suomi.join(", ")));

  const merkinnat = [];
  if (sana.taivutus.length) merkinnat.push(sana.taivutus.join(" · "));
  const alarivi = [sana.sanaluokka, sana.luokka].filter(Boolean).join(" · ");
  if (alarivi) merkinnat.push(alarivi);
  if (sana.rektio) merkinnat.push("rektio: " + sana.rektio);
  const pari = sana.vastakohta && sanatTunnuksella.get(sana.vastakohta);
  if (pari) merkinnat.push("↔ " + pari.ruotsi);
  for (const teksti of merkinnat) lisaa(lohko, el("p", "vihje t-pieni haalea", teksti));

  const aani = aaninappi(sana.ruotsi);
  if (aani) { aani.style.margin = "0.75rem auto 0"; lisaa(lohko, aani); }
  if (sana.esimerkit.length) {
    const lista = esimerkkiLista(sana.esimerkit.slice(0, 3));
    lista.style.textAlign = "left";
    lista.style.marginTop = "1rem";
    lisaa(lohko, lista);
  }
  return lohko;
}

function jatkaHetkenPaasta(osui, jatko) {
  // Oikea vastaus ei tarvitse lukuaikaa; väärä tarvitsee.
  setTimeout(jatko, osui ? 550 : 1400);
}

function seuraavatSanatLista(sanat, otsikko = "Tulossa") {
  const lohko = el("div", "pino-tiivis");
  lisaa(lohko, el("p", "t-nano haalein", otsikko.toUpperCase()));
  for (const sana of sanat) {
    const rivi = el("div", "sana-rivi");
    const sisus = el("div", "sisus");
    lisaa(sisus, el("div", "sv", hakusana(sana)));
    lisaa(sisus, el("div", "fi", sana.suomi.join(", ")));
    lisaa(rivi, el("i", "osaaminen"), sisus);
    lisaa(lohko, rivi);
  }
  return lohko;
}

function esimerkkiLista(esimerkit) {
  const lista = el("ul", "esimerkit");
  for (const esim of esimerkit) {
    const kohta = el("li", null, esim.sv);
    if (esim.fi) lisaa(kohta, el("span", "kaannos", esim.fi));
    lisaa(lista, kohta);
  }
  return lista;
}

function teoriaLinkki(sana) {
  const b = nappi("Näytä asiayhteydessä", "hiljainen leve", () => {
    naytaTeoriassa(sana);
  });
  return b;
}

/* ==========================================================================
   9. Kertaa – välitoisto, aina kirjoittamalla
   ========================================================================== */
const ISTUNNON_PITUUS = 20;
let kertausIstunto = null;

function eraantyvatKortit() {
  const sallitut = new Set(suodatetutSanat().map((s) => s.id));
  return kortit
    .filter((kortti) => sallitut.has(kortti.sana.id) && erääntyy(kortti))
    .sort((a, b) => (tila(a).nextReview || 0) - (tila(b).nextReview || 0));
}

/* Neljä tapaa harjoitella yhtä kategoriaa. Suunta rajaa kortit: kirjoitustiloissa
   vain toinen suunta, flashcardeissa ja monivalinnassa molemmat. */
/* Kuvake haetaan nimellä vasta piirrettäessä: KUVAKKEET määritellään
   myöhemmin tiedostossa, eikä siihen voi viitata tässä. */
const TREENITILAT = [
  { id: "flashcard",   nimi: "Flashcards",         kuvaus: "Katso, muista, käännä kortti",
    kuvake: "kortti",   vari: "var(--luokka-verbi)",        suunnat: null },
  { id: "kirjoita-sv", nimi: "Kirjoita ruotsiksi", kuvaus: "Suomesta ruotsiin",
    kuvake: "kyna",     vari: "var(--luokka-prepositio)",   suunnat: ["fi→sv"] },
  { id: "kirjoita-fi", nimi: "Kirjoita suomeksi",  kuvaus: "Ruotsista suomeen",
    kuvake: "kyna",     vari: "var(--luokka-substantiivi)", suunnat: ["sv→fi"] },
  { id: "monivalinta", nimi: "Monivalinta",        kuvaus: "Neljä vaihtoehtoa",
    kuvake: "ruudukko", vari: "var(--huomio)",              suunnat: null },
];

let harjoitusValinta = null;   // { otsikko, sanat }

function avaaHarjoitusvalinta(otsikko, sanat) {
  const kelpaavat = sanat.filter(kelpaaKortiksi);
  if (!kelpaavat.length) return;
  harjoitusValinta = { otsikko, sanat: kelpaavat };
  kertausIstunto = null;
  vaihdaValilehti("kertaa");
}

function aloitaTreeni(treenitila) {
  const lista = [];
  for (const sana of harjoitusValinta.sanat) {
    for (const kortti of kortitSanalla.get(sana.id) || []) {
      if (!treenitila.suunnat || treenitila.suunnat.includes(kortti.suunta)) lista.push(kortti);
    }
  }
  const otsikko = harjoitusValinta.otsikko;
  harjoitusValinta = null;
  if (!lista.length) return;
  aloitaKertaus(sekoita(lista));
  kertausIstunto.vapaa = true;      // ei sotke välitoiston aikataulua
  kertausIstunto.otsikko = otsikko;
  kertausIstunto.tila = treenitila.id;
  kertausIstunto.tilanNimi = treenitila.nimi;
}

function naytaHarjoitusvalinta() {
  const { otsikko, sanat } = harjoitusValinta;
  const lohko = el("div", "pino");

  const ylin = el("div", "kysymys");
  lisaa(ylin, el("p", "kehote t-nano haalein", "HARJOITTELE"));
  lisaa(ylin, el("p", "sana t-otsikko", otsikko));
  lisaa(ylin, el("p", "vihje t-pieni haalea", sanat.length + " sanaa · valitse tapa"));
  lisaa(lohko, ylin);

  const ruudukko = el("div", "vaihtoehdot ruudukko");
  for (const treenitila of TREENITILAT) {
    const b = el("button", "vaihtoehto tilalaatta");
    b.type = "button";
    const kuori = el("span", "laatta-kuvake");
    kuori.style.setProperty("--luokkavari", treenitila.vari);
    lisaa(kuori, ikoni(KUVAKKEET[treenitila.kuvake], 22));
    lisaa(b, kuori);
    lisaa(b, el("span", "t-vali", treenitila.nimi));
    lisaa(b, el("span", "t-pieni haalea", treenitila.kuvaus));
    b.addEventListener("click", () => { aloitaTreeni(treenitila); piirra(); });
    lisaa(ruudukko, b);
  }
  lisaa(lohko, ruudukko);

  lisaa(lohko, nappi("Peruuta", "hiljainen leve", () => {
    harjoitusValinta = null;
    vaihdaValilehti("teoria");
  }));
  return lohko;
}

function aloitaKertaus(lista) {
  edistysArvot.delete("kertaus");
  kertausIstunto = {
    jono: lista.slice(0, ISTUNNON_PITUUS),
    indeksi: 0, oikein: 0, vaarin: 0, vastattu: null,
  };
}

function naytaKertaa() {
  if (harjoitusValinta) return naytaHarjoitusvalinta();
  if (!kertausIstunto) {
    const eraantyvat = eraantyvatKortit();
    const lohko = el("div", "pino");
    if (!eraantyvat.length) {
      const seuraava = kortit
        .map(tila).filter((t) => t?.graduated && t.nextReview)
        .sort((a, b) => a.nextReview - b.nextReview)[0];
      const teksti = seuraava
        ? "Seuraavat kortit erääntyvät " + new Date(seuraava.nextReview).toLocaleDateString("fi-FI") + "."
        : "Aloita Opi-välilehdeltä, niin kortteja alkaa kertyä tänne.";
      lisaa(lohko, tyhjaNakyma("Ei kerrattavaa tänään", teksti,
        nappi("Opi uusia sanoja", "ensisijainen", () => vaihdaValilehti("opi")), "✓"));
      return lohko;
    }
    const kortti = el("div", "kortti pino");
    lisaa(kortti, el("p", "t-nano haalein", "ERÄÄNTYNYT"));
    lisaa(kortti, el("p", "t-nayttava", String(eraantyvat.length)));
    lisaa(kortti, el("p", "t-pieni haalea",
      eraantyvat.length > ISTUNNON_PITUUS
        ? `Istunnossa ${ISTUNNON_PITUUS} korttia kerrallaan, loput jäävät jonoon.`
        : "Kaikki kirjoittamalla – tunnistaminen ja tuottaminen ovat eri taitoja."));
    lisaa(kortti, nappi("Aloita kertaus", "ensisijainen leve",
      () => { aloitaKertaus(eraantyvat); piirra(); }));
    lisaa(lohko, kortti);
    return lohko;
  }

  const { jono, indeksi } = kertausIstunto;
  if (indeksi >= jono.length) {
    const { oikein, vaarin } = kertausIstunto;
    kertausIstunto = null;
    const lohko = el("div", "pino");
    lisaa(lohko, tyhjaNakyma("Istunto valmis",
      `${oikein} oikein, ${vaarin} väärin.`, null, "✓"));
    const napit = el("div", "napit");
    if (eraantyvatKortit().length) {
      lisaa(napit, nappi("Jatka kertausta", "ensisijainen",
        () => { aloitaKertaus(eraantyvatKortit()); piirra(); }));
    }
    lisaa(napit, nappi("Harjoitukset", "", () => vaihdaValilehti("harjoitukset")));
    lisaa(lohko, napit);
    return lohko;
  }

  const kortti = jono[indeksi];
  const { sana, suunta } = kortti;
  const lohko = el("div", "pino");

  lisaa(lohko, edistyspalkki("kertaus", indeksi / jono.length));

  const yla = el("div", "rivi-vali t-nano haalein");
  lisaa(yla, el("span", null, (suunta === SUUNNAT.FISV ? "SUOMI → RUOTSI" : "RUOTSI → SUOMI")));
  lisaa(yla, el("span", null, `${indeksi + 1} / ${jono.length}`));
  lisaa(lohko, yla);

  const laatikko = el("div", "kortti");
  const treenitila = kertausIstunto.tila || "kirjoita";
  const seuraava = () => { kertausIstunto.indeksi += 1; piirra(); };

  if (treenitila === "flashcard") {
    lisaa(laatikko, kysymysLohko("Muista käännös", kysymysTeksti(sana, suunta),
      sanavihje(sana), suunta === SUUNNAT.SVFI ? sana.ruotsi : null));
    const paljasta = nappi("Näytä vastaus", "ensisijainen leve", () => {
      paljasta.remove();
      const vastaus = el("div", "palaute saapuu");
      vastaus.style.background = "var(--pinta-2)";
      lisaa(vastaus, el("div", "oikea-vastaus", hyvaksytytVastaukset(sana, suunta).join(" / ")));
      const muodot = suunta === SUUNNAT.FISV ? taivutusMuodot(sana) : null;
      if (muodot) lisaa(vastaus, el("div", "lisa t-pieni", muodot));
      lisaa(laatikko, vastaus);
      if (sana.esimerkit.length) lisaa(laatikko, esimerkkiLista(sana.esimerkit.slice(0, 2)));
      const arvio = el("div", "napit");
      lisaa(arvio, nappi("En osannut", "", () => {
        kirjaaKertausvastaus(kortti, 0, false);
        seuraava();
      }));
      const osasin = nappi("Osasin", "ensisijainen", () => {
        kirjaaKertausvastaus(kortti, 5, true);
        seuraava();
      });
      lisaa(arvio, osasin);
      lisaa(laatikko, arvio);
      osasin.focus();
    });
    lisaa(laatikko, paljasta);
    queueMicrotask(() => paljasta.focus());

  } else if (treenitila === "monivalinta") {
    const oikea = lyhytVastaus(sana, suunta);
    lisaa(laatikko, kysymysLohko("Valitse oikea", kysymysTeksti(sana, suunta),
      sanavihje(sana), suunta === SUUNNAT.SVFI ? sana.ruotsi : null));
    lisaa(laatikko, vaihtoehtolohko(sekoita([oikea, ...hairiot(sana, suunta)]), (valittu, palkki) => {
      const osui = valittu === oikea;
      for (const b of palkki.children) {
        b.disabled = true;
        if (b.textContent === oikea) b.classList.add("oikein");
        else if (b.textContent === valittu) b.classList.add("vaarin");
      }
      kirjaaKertausvastaus(kortti, osui ? 5 : 0, osui, valittu, oikea);
      if (sana.esimerkit.length) lisaa(laatikko, esimerkkiLista(sana.esimerkit.slice(0, 2)));
      const jatka = nappi("Jatka", "ensisijainen leve", seuraava);
      lisaa(laatikko, jatka);
      jatka.focus();
    }));

  } else {
    lisaa(laatikko, kysymysLohko(
      suunta === SUUNNAT.FISV ? "Kirjoita ruotsiksi" : "Kirjoita suomeksi",
      kysymysTeksti(sana, suunta),
      sanavihje(sana) + (onLeech(kortti) ? " · vaikea sana" : ""),
      suunta === SUUNNAT.SVFI ? sana.ruotsi : null));

    const muoto = vastauslomake({
      paikanpitaja: suunta === SUUNNAT.FISV ? "ruotsiksi" : "suomeksi",
      onTarkista: ([arvo]) => {
        const tulos = tarkistaVastaus(arvo, sana, suunta);
        const osui = tulos.tulos === "oikein";
        kirjaaKertausvastaus(kortti, osui ? 5 : (tulos.tulos === "melkein" ? 2 : 0),
                             osui, arvo, tulos.oikeat[0]);
        // Esimerkit napin alapuolelle: näin toimintonappi ei siirry pituuden mukaan.
        if (sana.esimerkit.length) lisaa(laatikko, esimerkkiLista(sana.esimerkit.slice(0, 2)));
        return {
          tulos: tulos.tulos, oikea: tulos.oikeat.join(" / "), kirjoitettu: arvo,
          lisatieto: tulos.syy === "tarkkeet" ? "Kirjainmerkki ratkaisee: kokeessa tämä on virhe." : null,
          taivutus: taivutusMuodot(sana),
        };
      },
      onJatka: seuraava,
    });
    lisaa(laatikko, muoto);
    queueMicrotask(() => muoto._kentat[0].focus());
  }

  lisaa(lohko, laatikko);
  lisaa(lohko, teoriaLinkki(sana));
  return lohko;
}

/* Yhteinen kirjaus kaikille kertaustavoille. Välitoiston aikataulua muutetaan
   vain valmistuneille korteille, kun kyse on vapaasta kategoriaharjoittelusta –
   muuten yksi flashcard-kierros sotkisi koko aikataulun. */
function kirjaaKertausvastaus(kortti, laatu, osui, kirjoitettu, oikea) {
  const t = tilaTaiUusi(kortti);
  t.nahty += 1;
  if (!osui) {
    t.virheita += 1;
    if (kirjoitettu != null) kirjaaVirhe(kortti, kirjoitettu, oikea);
  }
  if (t.graduated || !kertausIstunto.vapaa) paivitaValitoisto(t, laatu);
  kertausIstunto[osui ? "oikein" : "vaarin"] += 1;
  tallenna();
}

/* Harvinainen hetki – erän tai istunnon päätös. Ainoa paikka sovelluksessa,
   jossa liikettä saa olla enemmän kuin välttämätön. */
function tyhjaNakyma(otsikko, teksti, toiminto, kuva) {
  const lohko = el("div", "tyhja");
  const portaat = [];
  if (kuva) {
    const kuori = el("div", "kuva");
    lisaa(kuori, kuva === "✓" ? valmisMerkki() : el("span", null, kuva));
    portaat.push(kuori);
  }
  portaat.push(el("h2", "t-otsikko", otsikko));
  portaat.push(el("p", "t-pieni", teksti));
  if (toiminto) { toiminto.style.marginTop = "1rem"; portaat.push(toiminto); }
  portaat.forEach((solmu, i) => {
    solmu.classList.add("porras");
    solmu.style.animationDelay = (i * 60) + "ms";
    lisaa(lohko, solmu);
  });
  return lohko;
}

function valmisMerkki() {
  const svg = ikoni('<circle cx="12" cy="12" r="9.5" opacity="0.28"/><path class="merkkiPiirto" d="m7.5 12.4 3.1 3.1 6-6.4"/>', 44);
  svg.setAttribute("stroke-width", "1.9");
  svg.style.color = "var(--oikein)";
  return svg;
}

/* ==========================================================================
   10. Harjoitukset – kaikki samasta datasta, ei erillistä sisältöä
   ========================================================================== */
const AJAN_PREPOSITIOT = ["i", "på", "om", "för", "under", "sedan", "inom", "före",
                          "efter", "från", "till", "mellan", "vid"];

function ensimmainenVaihtoehto(teksti) { return teksti.split(" / ")[0].trim(); }

function taivutusTehtavat() {
  const OTSIKOT = {
    verbi: ["preesens", "imperfekti", "supiini"],
    substantiivi: ["yks. määräinen", "mon. epämääräinen", "mon. määräinen"],
    adjektiivi: ["ett-muoto", "monikko"],
  };
  return suodatetutSanat()
    .filter((sana) => sana.taivutus.length >= 2 && OTSIKOT[sana.sanaluokka]
                      && !sana.ruotsi.includes(" / ") && kelpaaKortiksi(sana))
    .map((sana) => ({
      tyyppi: "kentat",
      sana,
      kehote: "Täydennä taivutus",
      kysymys: (sana.suku ? sana.suku + " " : "") + sana.ruotsi,
      // Taivutusluokka kertoo kaavan. Ilman sitä muodot on haettava muistista,
      // mikä on lähempänä kokeen tilannetta.
      vihje: [sana.sanaluokka,
              edistyminen.asetukset.naytaLuokka ? sana.luokka : null,
              sana.suomi[0]].filter(Boolean).join(" · "),
      kentat: sana.taivutus.map((muoto, i) => ({
        otsikko: OTSIKOT[sana.sanaluokka][i] || "muoto " + (i + 1),
        vastaukset: [muoto],
      })),
    }));
}

function rektioTehtavat() {
  const tulos = [];
  for (const sana of suodatetutSanat()) {
    if (!sana.rektio || !kelpaaKortiksi(sana)) continue;
    const vaihtoehdot = sana.rektio.split("/").map((p) => p.trim());
    const ensimmainen = vaihtoehdot[0];
    const kuvio = new RegExp("(^|\\s)" + ensimmainen + "(\\s|$)");
    let lause = null;
    for (const esim of sana.esimerkit) {
      if (esim.sv && kuvio.test(esim.sv)) { lause = esim; break; }
    }
    const pohja = lause ? lause.sv : ensimmainenVaihtoehto(sana.ruotsi);
    let kysymys;
    if (kuvio.test(pohja)) {
      kysymys = pohja.replace(kuvio, (osuma, a, b) => a + "___" + b);
    } else {
      kysymys = pohja + " ___";
    }
    tulos.push({
      tyyppi: "kirjoita",
      sana,
      kehote: "Mikä prepositio?",
      kysymys,
      vihje: (lause && lause.fi) ? lause.fi : sana.suomi.join(", "),
      paikanpitaja: "prepositio",
      vastaukset: vaihtoehdot,
    });
  }
  return tulos;
}

function prepositioTehtavat() {
  const tulos = [];
  for (const sana of suodatetutSanat()) {
    if (!/^6 /.test(sana.kategoria || "")) continue;
    if (!/^6\.[12]\b/.test(sana.alakategoria || "")) continue;
    const lauseke = ensimmainenVaihtoehto(sana.ruotsi);
    const osat = lauseke.split(" ");
    if (osat.length < 2 || !AJAN_PREPOSITIOT.includes(osat[0])) continue;
    tulos.push({
      tyyppi: "kirjoita",
      sana,
      kehote: "Aika vai paikka?",
      kysymys: "___ " + osat.slice(1).join(" "),
      vihje: ensimmainenVaihtoehto(sana.suomi.join(", ")),
      paikanpitaja: "prepositio",
      vastaukset: [osat[0]],
    });
  }
  return tulos;
}

function vastakohtaTehtavat() {
  const tulos = [];
  for (const sana of suodatetutSanat()) {
    if (!sana.vastakohta || !kelpaaKortiksi(sana)) continue;
    const pari = sanatTunnuksella.get(sana.vastakohta);
    if (!pari) continue;
    tulos.push({
      tyyppi: "kirjoita",
      sana: pari,
      kehote: "Mikä on vastakohta?",
      kysymys: sana.ruotsi,
      vihje: sana.suomi.join(", ") + " ↔ " + pari.suomi.join(", "),
      paikanpitaja: "ruotsiksi",
      vastaukset: hyvaksytytVastaukset(pari, SUUNNAT.FISV),
    });
  }
  return tulos;
}

function lauseTehtavat() {
  const tulos = [];
  for (const sana of suodatetutSanat()) {
    for (const esim of sana.esimerkit) {
      if (!esim.sv || !esim.fi) continue;
      const sanoja = esim.sv.split(/\s+/).length;
      if (sanoja < 2 || sanoja > 7) continue;
      tulos.push({
        tyyppi: "kirjoita",
        sana,
        kehote: "Käännä ruotsiksi",
        kysymys: esim.fi,
        vihje: "Avainsana: " + sana.ruotsi,
        paikanpitaja: "ruotsiksi",
        vastaukset: [esim.sv],
      });
    }
  }
  return tulos;
}

function sukuTehtavat() {
  return suodatetutSanat()
    .filter((sana) => sana.suku && kelpaaKortiksi(sana))
    .map((sana) => ({
      tyyppi: "napit",
      sana,
      kehote: "en vai ett?",
      kysymys: sana.ruotsi,
      vihje: sana.suomi.join(", "),
      napit: ["en", "ett"],
      vastaukset: [sana.suku],
    }));
}

function laatta(vari, sisalto, numero) {
